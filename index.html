<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LK MOTORS - 스마트 드래그 & 수정 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; overflow: hidden; }
        .bg-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.05); }
        /* 드래그 가능 구역 */
        .dr-zone { min-height: 180px; border: 2px dashed #334155; border-radius: 20px; padding: 10px; transition: 0.3s; }
        /* 차량 카드 (드래그 대상) */
        .car-card { cursor: grab; background: #334155; padding: 12px; border-radius: 16px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .car-card:active { cursor: grabbing; }
        /* 수정 버튼 스타일 */
        .edit-btn { position: absolute; top: 8px; right: 8px; font-size: 12px; color: #94a3b8; opacity: 0; transition: 0.2s; }
        .car-card:hover .edit-btn { opacity: 1; }
        .input-group label { display: block; font-size: 10px; font-weight: 900; color: #94a3b8; margin-bottom: 4px; }
        .input-group input, .input-group textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; color: #fff; outline: none; }
    </style>
</head>
<body class="h-screen flex flex-col p-4">

    <div id="login-layer" class="fixed inset-0 bg-slate-950 z-[5000] flex items-center justify-center">
        <div class="bg-slate-900 p-12 rounded-[40px] shadow-2xl w-full max-w-sm text-center">
            <h1 class="text-3xl font-black italic text-blue-500 mb-8">LK MOTORS</h1>
            <input type="password" id="pw" placeholder="PASSWORD" class="w-full bg-slate-800 rounded-2xl py-4 px-6 mb-4 text-center text-white font-bold outline-none">
            <button onclick="login()" class="w-full py-4 bg-blue-600 rounded-2xl font-black">접속하기</button>
        </div>
    </div>

    <header class="flex justify-between items-center mb-6 px-2">
        <h1 class="text-2xl font-black italic text-blue-500 tracking-tighter uppercase">Workshop Control</h1>
        <button onclick="openRegModal()" class="bg-blue-600 px-6 py-2.5 rounded-xl font-black text-xs">신규 예약 등록</button>
    </header>

    <div class="flex-1 flex gap-4 overflow-hidden">
        <aside class="w-72 flex flex-col gap-4">
            <div class="bg-card flex-1 rounded-[30px] p-5 flex flex-col shadow-xl">
                <h3 class="text-blue-400 font-black text-xs mb-4 italic uppercase tracking-widest border-b border-white/5 pb-2">Waiting</h3>
                <div id="wait-zone" class="flex-1 overflow-y-auto dr-zone custom-scroll" data-bay="0"></div>
            </div>
        </aside>

        <main class="flex-1 grid grid-cols-5 gap-4 overflow-y-auto pr-2" id="bay-grid">
            </main>

        <aside class="w-72 flex flex-col gap-4">
            <div class="bg-card flex-1 rounded-[30px] p-5 flex flex-col shadow-xl border-l-4 border-emerald-500">
                <h3 class="text-emerald-400 font-black text-xs mb-4 italic uppercase tracking-widest border-b border-white/5 pb-2">Done / Out</h3>
                <div id="done-zone" class="flex-1 overflow-y-auto dr-zone custom-scroll" data-bay="99"></div>
            </div>
        </aside>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-black/90 z-[4000] hidden items-center justify-center p-4 backdrop-blur-xl">
        <div class="bg-slate-900 w-full max-w-xl rounded-[40px] shadow-2xl border border-white/10 overflow-hidden">
            <div class="p-10">
                <h2 class="text-2xl font-black italic text-blue-500 mb-8 uppercase" id="modal-title">Edit Reservation</h2>
                <input type="hidden" id="target-id">
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div class="input-group"><label>차량 번호</label><input type="text" id="m-car"></div>
                        <div class="input-group"><label>고객명</label><input type="text" id="m-name"></div>
                        <div class="input-group"><label>연락처</label><input type="text" id="m-phone"></div>
                    </div>
                    <div class="space-y-4">
                        <div class="input-group"><label>날짜 / 시간</label>
                            <div class="flex gap-2"><input type="date" id="m-date"><input type="time" id="m-time"></div>
                        </div>
                        <div class="input-group"><label>모델 / 주행거리</label>
                            <div class="flex gap-2"><input type="text" id="m-model" placeholder="차종"><input type="number" id="m-km" placeholder="km"></div>
                        </div>
                        <div class="input-group"><label>정비 상세 내용</label><textarea id="m-desc" class="h-20 resize-none"></textarea></div>
                    </div>
                </div>
                <div class="flex gap-4 mt-8">
                    <button onclick="closeModal()" class="flex-1 py-4 bg-slate-800 rounded-2xl font-bold">취소</button>
                    <button onclick="saveData()" class="flex-[2] py-4 bg-blue-600 rounded-2xl font-black text-lg">정보 저장하기</button>
                </div>
                <button id="del-btn" onclick="deleteData()" class="w-full mt-4 text-xs text-red-500 font-bold opacity-50 hover:opacity-100">차량 데이터 삭제</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDhTPGNKNm38PSBdATs9lks0lYu52QrP3A",
            authDomain: "lkmotors-246f1.firebaseapp.com",
            databaseURL: "https://lkmotors-246f1-default-rtdb.firebaseio.com",
            projectId: "lkmotors-246f1",
            storageBucket: "lkmotors-246f1.firebasestorage.app",
            messagingSenderId: "389443224",
            appId: "1:389443224:web:c9b78c1afd3abc1c262aed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function login() {
            if(document.getElementById('pw').value === "9999") {
                document.getElementById('login-layer').style.display = 'none';
                initBays(); initDraggable();
            } else { alert("비밀번호 불일치"); }
        }

        function initBays() {
            const grid = document.getElementById('bay-grid'); grid.innerHTML = "";
            for(let i=1; i<=5; i++) {
                grid.innerHTML += `<div class="bg-card rounded-[35px] p-5 flex flex-col gap-4 shadow-xl">
                    <span class="text-[10px] font-black text-slate-500 uppercase">BAY ${i}</span>
                    <div id="bay-zone-${i}" class="dr-zone flex-1" data-bay="${i}"></div>
                </div>`;
            }
            startSync();
        }

        function initDraggable() {
            document.querySelectorAll('.dr-zone').forEach(el => {
                new Sortable(el, { group: 'vehicles', animation: 150, ghostClass: 'bg-blue-500/10', onEnd: (evt) => {
                    db.ref('repairs/' + evt.item.getAttribute('data-id')).update({ bay: evt.to.getAttribute('data-bay') });
                }});
            });
        }

        function startSync() {
            db.ref('repairs').on('value', (s) => {
                const data = s.val();
                document.querySelectorAll('.dr-zone').forEach(z => z.innerHTML = ""); 
                for(let id in data) {
                    const car = data[id];
                    const carHtml = `<div class="car-card" data-id="${id}" onclick="openEditModal('${id}')">
                        <p class="text-blue-500 font-black text-sm mb-1">${car.carNo}</p>
                        <p class="text-[10px] font-bold text-slate-200">${car.name} <span class="opacity-30">| ${car.model || ''}</span></p>
                        <button class="edit-btn"><i class="fas fa-cog"></i></button>
                    </div>`;
                    
                    if(car.bay == "0") document.getElementById('wait-zone').innerHTML += carHtml;
                    else if(car.bay == "99") document.getElementById('done-zone').innerHTML += carHtml;
                    else {
                        const target = document.getElementById(`bay-zone-${car.bay}`);
                        if(target) target.innerHTML += carHtml;
                    }
                }
            });
        }

        // 팝업 열기 (신규/수정 공용)
        function openEditModal(id) {
            document.getElementById('target-id').value = id || "";
            document.getElementById('modal-title').innerText = id ? "Edit Reservation" : "New Reservation";
            document.getElementById('del-btn').style.display = id ? "block" : "none";

            if(id) { // 수정 모드: 기존 데이터 채우기
                db.ref('repairs/' + id).once('value', s => {
                    const d = s.val();
                    document.getElementById('m-car').value = d.carNo;
                    document.getElementById('m-name').value = d.name;
                    document.getElementById('m-phone').value = d.phone;
                    document.getElementById('m-date').value = d.date;
                    document.getElementById('m-time').value = d.r_time;
                    document.getElementById('m-model').value = d.model;
                    document.getElementById('m-km').value = d.km;
                    document.getElementById('m-desc').value = d.desc;
                });
            } else { // 신규 모드: 빈칸
                document.querySelectorAll('#edit-modal input, #edit-modal textarea').forEach(i => i.value = "");
            }
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function saveData() {
            const id = document.getElementById('target-id').value;
            const data = {
                carNo: document.getElementById('m-car').value,
                name: document.getElementById('m-name').value,
                phone: document.getElementById('m-phone').value,
                date: document.getElementById('m-date').value,
                r_time: document.getElementById('m-time').value,
                model: document.getElementById('m-model').value,
                km: document.getElementById('m-km').value,
                desc: document.getElementById('m-desc').value
            };
            if(!data.carNo) return alert("번호 필수");

            if(id) db.ref('repairs/' + id).update(data).then(() => closeModal());
            else {
                data.bay = "0"; data.status = "대기중";
                db.ref('repairs').push(data).then(() => closeModal());
            }
        }

        function deleteData() {
            if(confirm("정말로 삭제하시겠습니까?")) {
                db.ref('repairs/' + document.getElementById('target-id').value).remove().then(() => closeModal());
            }
        }

        function openRegModal() { openEditModal(null); }
        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }
    </script>
</body>
</html>
