<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LK MOTORS - 지능형 드래그 관제 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; overflow: hidden; }
        .dashboard-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.05); }
        .bay-target { min-height: 120px; border: 2px dashed #334155; border-radius: 20px; transition: 0.3s; }
        .bay-target.drag-over { border-color: #3b82f6; background: rgba(59,130,246,0.1); }
        .car-item { cursor: grab; background: #334155; border-radius: 12px; padding: 10px; margin-bottom: 8px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); }
        .car-item:active { cursor: grabbing; }
        .sortable-ghost { opacity: 0.3; background: #3b82f6 !important; }
    </style>
</head>
<body class="h-screen flex flex-col p-4">

    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center">
        <div class="bg-slate-800 p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center">
            <h1 class="text-3xl font-black mb-8 italic">LK MOTORS</h1>
            <input type="password" id="admin-pw" placeholder="PASSWORD" class="w-full bg-slate-900 rounded-2xl py-4 px-6 mb-4 text-center outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="checkLogin()" class="w-full py-4 bg-blue-600 rounded-2xl font-black">LOGIN</button>
        </div>
    </div>

    <header class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-black italic text-blue-500">WORKFLOW CONTROL</h1>
        <div class="flex gap-4">
            <button onclick="openModal('res-modal')" class="bg-indigo-600 px-6 py-2 rounded-full font-bold text-sm"><i class="fas fa-calendar-plus mr-2"></i>예약등록</button>
        </div>
    </header>

    <div class="flex-1 flex gap-6 overflow-hidden">
        <aside class="w-72 flex flex-col gap-4">
            <div class="dashboard-card flex-1 rounded-[30px] p-5 flex flex-col">
                <h3 class="text-blue-400 font-black text-sm mb-4 italic uppercase">📋 Wait List</h3>
                <div id="wait-list" class="flex-1 overflow-y-auto pr-2 dr-zone" data-bay="0">
                    </div>
            </div>
        </aside>

        <main class="flex-1 grid grid-cols-5 gap-4 overflow-y-auto pr-2" id="bay-grid">
            </main>

        <aside class="w-72 flex flex-col gap-4">
            <div class="dashboard-card flex-1 rounded-[30px] p-5 flex flex-col border-l-4 border-emerald-500">
                <h3 class="text-emerald-400 font-black text-sm mb-4 italic uppercase">✅ Done / Out</h3>
                <div id="done-list" class="flex-1 overflow-y-auto pr-2 dr-zone" data-bay="99">
                    </div>
            </div>
        </aside>
    </div>

    <div id="res-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
        <div class="bg-white text-slate-900 w-full max-w-md rounded-[40px] p-8">
            <h2 class="text-2xl font-black mb-6">📅 정비 일정 등록</h2>
            <div class="space-y-4">
                <input type="text" id="reg-carNo" placeholder="차량번호" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold">
                <input type="text" id="reg-owner" placeholder="고객명" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold">
                <input type="date" id="reg-date" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold">
                <textarea id="reg-desc" placeholder="정비요청사항" class="w-full bg-slate-100 p-4 rounded-2xl outline-none h-24"></textarea>
            </div>
            <button onclick="saveRes()" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black mt-6">일정 추가</button>
            <button onclick="closeModal('res-modal')" class="w-full py-2 text-slate-400 font-bold mt-2">닫기</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDhTPGNKNm38PSBdATs9lks0lYu52QrP3A",
            authDomain: "lkmotors-246f1.firebaseapp.com",
            databaseURL: "https://lkmotors-246f1-default-rtdb.firebaseio.com",
            projectId: "lkmotors-246f1",
            storageBucket: "lkmotors-246f1.firebasestorage.app",
            messagingSenderId: "389443224",
            appId: "1:389443224:web:c9b78c1afd3abc1c262aed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function checkLogin() {
            if(document.getElementById('admin-pw').value === "9999") {
                document.getElementById('login-screen').style.display = 'none';
                initBays();
                initDraggable();
            } else { alert("비번 틀림"); }
        }

        // 베이 생성
        function initBays() {
            const grid = document.getElementById('bay-grid');
            grid.innerHTML = "";
            for(let i=1; i<=10; i++) {
                grid.innerHTML += `
                    <div class="dashboard-card rounded-[30px] p-4 flex flex-col gap-2">
                        <span class="text-[10px] font-black text-slate-500 uppercase">BAY ${i}</span>
                        <div id="bay-zone-${i}" class="bay-target dr-zone flex-1" data-bay="${i}"></div>
                    </div>`;
            }
            startSync();
        }

        // 드래그 기능 초기화 (SortableJS)
        function initDraggable() {
            const zones = document.querySelectorAll('.dr-zone');
            zones.forEach(zone => {
                new Sortable(zone, {
                    group: 'cars',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: function (evt) {
                        const carId = evt.item.getAttribute('data-id');
                        const targetBay = evt.to.getAttribute('data-bay');
                        updateCarLocation(carId, targetBay);
                    }
                });
            });
        }

        function startSync() {
            db.ref('repairs').on('value', (s) => {
                const data = s.val();
                document.querySelectorAll('.dr-zone').forEach(z => z.innerHTML = ""); // 초기화
                
                for(let key in data) {
                    const car = data[key];
                    const carHtml = `
                        <div class="car-item text-xs" data-id="${key}">
                            <div class="flex justify-between mb-1"><span class="text-blue-400">${car.carNo}</span></div>
                            <div class="text-[10px] opacity-60">${car.owner} / ${car.status}</div>
                        </div>`;
                    
                    if(car.bay == "0") document.getElementById('wait-list').innerHTML += carHtml;
                    else if(car.bay == "99") document.getElementById('done-list').innerHTML += carHtml;
                    else {
                        const target = document.getElementById(`bay-zone-${car.bay}`);
                        if(target) target.innerHTML += carHtml;
                    }
                }
            });
        }

        // 마우스로 옮겼을 때 데이터베이스 위치 변경
        function updateCarLocation(id, bay) {
            let status = "정비중";
            if(bay == "0") status = "대기중";
            if(bay == "99") status = "수리완료";
            
            db.ref('repairs/' + id).update({ bay: bay, status: status });
        }

        function saveRes() {
            const carNo = document.getElementById('reg-carNo').value;
            if(!carNo) return alert("번호 필수");
            db.ref('repairs').push({
                carNo: carNo, owner: document.getElementById('reg-owner').value,
                date: document.getElementById('reg-date').value, desc: document.getElementById('reg-desc').value,
                bay: "0", status: "대기중"
            }).then(() => closeModal('res-modal'));
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
