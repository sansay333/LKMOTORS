<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LK 모터스 - V8.1 마스터</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .bg-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.05); }
        .dr-zone { min-height: 120px; border: 1px dashed #334155; border-radius: 12px; padding: 10px; transition: all 0.3s; }
        
        /* 베이 레이아웃 고정 */
        .bay-item { display: flex; flex-direction: column; justify-content: space-between; padding: 15px !important; min-height: 250px !important; border-radius: 24px !important; background: #1e293b !important; border: 1px solid #334155 !important; position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .bay-v-no { font-size: 20px; font-weight: 900; color: #3b82f6; letter-spacing: -0.5px; }
        .bay-v-worker { font-size: 13px; font-weight: 900; color: #fbbf24; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 6px; }
        
        /* 차량 카드 (모바일 터치 최적화) */
        .car-card { cursor: pointer; background: #334155; padding: 12px; border-radius: 14px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 6px rgba(0,0,0,0.3); touch-action: none; position: relative; z-index: 10; }
        
        /* 탭 디자인 */
        .tab-btn { transition: all 0.2s; border-bottom: 3px solid transparent; color: #64748b; }
        .tab-btn.active { color: #3b82f6; border-bottom: 3px solid #3b82f6; font-weight: 900; }
        .tab-content { display: none; width: 100%; height: calc(100vh - 56px); }
        .tab-content.active { display: flex; flex-direction: column; }
        
        /* 입력창 디자인 (가독성 강화) */
        .input-group label { display: block; font-size: 12px; font-weight: 900; color: #94a3b8; margin-bottom: 5px; }
        .input-group input, .input-group textarea, .input-group select { 
            width: 100%; background: #0f172a; border: 1px solid #475569; border-radius: 10px; padding: 12px; 
            color: #fff; outline: none; font-size: 15px; font-weight: 700;
        }
        /* 사장님이 말씀하신 예약날짜/시간 폰트 색상 강화 */
        #m-date, #m-time { color: #ffffff !important; background: #1e40af !important; border: 1px solid #3b82f6 !important; }
        
        /* 히스토리 아이템 */
        .history-item { background: rgba(15, 23, 42, 0.8); border-left: 4px solid #3b82f6; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 12px; }
        
        /* FullCalendar 한글 및 커스텀 */
        .fc { background: #1e293b; color: #fff; border-radius: 20px; padding: 10px; }
        .fc-toolbar-title { font-weight: 900 !important; color: #3b82f6 !important; }
        .fc-day-today { background: rgba(59, 130, 246, 0.1) !important; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="login-layer" class="fixed inset-0 bg-slate-950 z-[9000] flex items-center justify-center p-6 text-center">
        <div class="bg-slate-900 p-10 rounded-[40px] shadow-2xl w-full max-w-sm border border-white/5">
            <h1 class="text-3xl text-blue-500 mb-8 font-black italic tracking-tighter uppercase">LK MOTORS V8.1</h1>
            <input type="password" id="pw" placeholder="시스템 비밀번호 입력" class="w-full bg-slate-800 rounded-2xl py-5 px-6 mb-6 text-center text-white font-bold outline-none border-2 border-transparent focus:border-blue-500 transition-all">
            <button onclick="login()" class="w-full py-5 bg-blue-600 rounded-2xl font-black text-white uppercase shadow-xl hover:bg-blue-500 active:scale-95 transition-all">시스템 접속</button>
        </div>
    </div>

    <div id="upload-modal" class="fixed inset-0 bg-black/95 z-[9999] hidden flex-col items-center justify-center p-6 text-white text-center">
        <div class="bg-slate-900 p-8 rounded-[40px] shadow-2xl w-full max-w-lg border border-blue-500/30">
            <h2 class="text-2xl text-blue-500 mb-4 font-black italic">장부 데이터 분석기</h2>
            <input type="file" id="csv-file" accept=".csv" class="mb-6 text-xs text-slate-400 block w-full border-2 border-dashed border-slate-700 p-8 rounded-3xl">
            <div id="upload-status" class="text-sm text-amber-500 mb-6 font-black h-6">파일을 선택해주세요</div>
            <div class="flex gap-4">
                <button onclick="closeModal('upload-modal')" class="flex-1 py-4 bg-slate-800 rounded-2xl font-bold">취소</button>
                <button onclick="processCSV()" class="flex-1 py-4 bg-blue-600 rounded-2xl font-black uppercase">가져오기 시작</button>
            </div>
        </div>
    </div>

    <nav class="h-14 bg-slate-900 border-b border-white/5 flex items-center px-4 justify-between shrink-0 shadow-2xl">
        <div class="flex gap-6 h-full">
            <button onclick="showTab('status')" id="btn-status" class="tab-btn active font-black text-xs">작업 현황판</button>
            <button onclick="showTab('res')" id="btn-res" class="tab-btn font-black text-xs">예약 및 리스트</button>
            <button onclick="showTab('customer')" id="btn-customer" class="tab-btn font-black text-xs text-amber-500">마스터 DB</button>
        </div>
        <div class="flex gap-3">
            <button onclick="document.getElementById('upload-modal').style.display='flex'" class="bg-slate-800 px-4 py-2 rounded-xl font-black text-[10px] text-blue-400 border border-blue-500/30">데이터 이관</button>
            <button onclick="openEditModal(null)" class="bg-blue-600 px-4 py-2 rounded-xl font-black text-[10px] text-white shadow-lg">신규 등록</button>
        </div>
    </nav>

    <main id="tab-status" class="tab-content active p-2 gap-2 overflow-y-auto">
        <section class="grid grid-cols-5 gap-2 shrink-0" id="bay-grid"></section>
        <section class="flex-1 grid grid-cols-2 lg:grid-cols-4 gap-2 pb-14">
            <div class="bg-card rounded-[32px] p-4 border-t-4 border-blue-500 shadow-2xl flex flex-col">
                <h3 class="text-blue-400 font-black text-[10px] mb-3 uppercase flex justify-between"><span>오늘 대기</span><span id="count-today">0</span></h3>
                <div id="today-zone" class="flex-1 dr-zone" data-bay="0"></div>
            </div>
            <div class="bg-card rounded-[32px] p-4 border-t-4 border-indigo-500 shadow-2xl flex flex-col">
                <h3 class="text-indigo-400 font-black text-[10px] mb-3 uppercase flex justify-between"><span>내일 예약</span><span id="count-tomorrow">0</span></h3>
                <div id="tomorrow-zone" class="flex-1 dr-zone" data-bay="0-t"></div>
            </div>
            <div class="bg-card rounded-[32px] p-4 border-t-4 border-amber-500 shadow-2xl flex flex-col">
                <h3 class="text-amber-500 font-black text-[10px] mb-3 uppercase flex justify-between"><span>이후 예정</span><span id="count-other">0</span></h3>
                <div id="other-zone" class="flex-1 dr-zone" data-bay="0-o"></div>
            </div>
            <div class="bg-card rounded-[32px] p-4 border-t-4 border-emerald-500 shadow-2xl flex flex-col">
                <h3 class="text-emerald-400 font-black text-[10px] mb-3 uppercase flex justify-between"><span>출고 완료</span><span id="count-done">0</span></h3>
                <div id="done-zone" class="flex-1 dr-zone" data-bay="99"></div>
            </div>
        </section>
    </main>

    <main id="tab-res" class="tab-content p-2 gap-2 overflow-hidden">
        <div class="flex-1 bg-slate-900 rounded-[32px] p-4 border border-white/5 overflow-hidden shadow-inner">
            <div id='calendar' class="h-full"></div>
        </div>
        <div id="list-view" class="h-1/3 bg-slate-900 rounded-[32px] p-5 overflow-y-auto border border-white/5 shadow-2xl">
            <h4 class="text-blue-400 font-black text-xs mb-4">상세 정비 리스트 (최신순)</h4>
            <table class="w-full text-left font-bold text-slate-300 text-[11px]">
                <thead class="text-slate-500 border-b border-white/10 sticky top-0 bg-slate-900">
                    <tr><th class="py-4 px-2">날짜/시간</th><th>차량 번호</th><th>고객명/연락처</th><th>차종</th><th>정비 내용</th></tr>
                </thead>
                <tbody id="list-body"></tbody>
            </table>
        </div>
    </main>

    <main id="tab-customer" class="tab-content p-6 gap-6 bg-slate-950">
        <div class="flex flex-col md:flex-row gap-4 items-center">
            <input type="text" id="cust-search" oninput="syncCustomerDB(this.value)" placeholder="뒷 4자리 또는 고객명 검색..." class="flex-1 bg-slate-800 p-5 rounded-2xl outline-none text-white font-bold border-2 border-transparent focus:border-amber-500 shadow-xl">
            <div class="flex gap-3 shrink-0 w-full md:w-auto">
                <button onclick="toggleSelectAll()" class="flex-1 bg-slate-700 py-4 px-6 rounded-2xl font-black text-xs">전체 선택</button>
                <button onclick="deleteSelectedCustomers()" class="flex-1 bg-red-600 py-4 px-6 rounded-2xl font-black text-xs shadow-lg">선택 삭제</button>
            </div>
        </div>
        <div class="flex-1 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4 overflow-y-auto pr-2" id="customer-grid"></div>
    </main>

    <div id="edit-modal" class="fixed inset-0 bg-black/95 z-[9900] hidden items-center justify-center p-4 backdrop-blur-2xl text-white">
        <div class="bg-slate-900 w-full max-w-3xl rounded-[48px] p-10 border border-white/10 relative overflow-y-auto max-h-[95vh] shadow-2xl">
            <button onclick="closeModal('edit-modal')" class="absolute top-8 right-10 text-5xl font-light text-slate-500">&times;</button>
            <input type="hidden" id="m-id">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10 mt-8">
                <div class="space-y-6">
                    <div class="input-group"><label>차량 번호</label><input type="text" id="m-car" oninput="fetchInfo(this.value, 'm')" class="uppercase font-black text-blue-400 text-2xl" placeholder="뒷 4자리 입력"></div>
                    <div class="input-group"><label>고객명 / 연락처</label><div class="flex gap-3"><input type="text" id="m-name" placeholder="고객 성함"><input type="text" id="m-phone" placeholder="전화번호"></div></div>
                    <div class="input-group"><label>차대번호 (VIN)</label><input type="text" id="m-vin" class="font-mono text-xs uppercase"></div>
                    <div class="input-group"><label>최초 등록일</label><input type="date" id="m-first-date"></div>
                    <p class="text-[10px] text-blue-500 font-black border-b border-white/5 pb-2 uppercase">정비 히스토리</p>
                    <div id="m-history-list" class="h-32 overflow-y-auto pr-2 space-y-2"></div>
                </div>
                <div class="space-y-6">
                    <div class="input-group"><label>담당 정비사</label><input type="text" id="m-mechanic" class="font-black text-amber-500" placeholder="작업자 성함"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label>정비 예약일</label><input type="date" id="m-date"></div>
                        <div><label>예약 시간</label><select id="m-time"></select></div>
                    </div>
                    <div class="input-group"><label>차량 모델명</label><input type="text" id="m-model" placeholder="차종 입력"></div>
                    <div class="input-group"><label>작업 상세 내용</label><textarea id="m-desc" class="h-32" placeholder="정비 내용을 입력하세요..."></textarea></div>
                </div>
            </div>
            <div class="flex gap-4 mt-12">
                <button onclick="deleteRecord('repairs', 'm-id')" class="flex-1 py-5 bg-red-600/20 text-red-500 border border-red-500/30 rounded-3xl font-black">기록 삭제</button>
                <button onclick="saveData()" class="flex-[2] py-5 bg-blue-600 rounded-3xl font-black text-white shadow-2xl">데이터 저장</button>
                <button onclick="releaseVehicle()" id="rel-btn" class="flex-1 py-5 bg-emerald-600 rounded-3xl font-black text-white shadow-2xl">작업 종료/출고</button>
            </div>
        </div>
    </div>

    <div id="c-modal" class="fixed inset-0 bg-black/95 z-[9950] hidden items-center justify-center p-4 text-white">
        <div class="bg-slate-900 w-full max-w-lg rounded-[40px] p-10 border border-amber-500/20 shadow-2xl relative">
            <button onclick="closeModal('c-modal')" class="absolute top-8 right-10 text-4xl font-light text-slate-500">&times;</button>
            <h2 class="text-xl font-black italic text-amber-500 mb-6">마스터 고객 DB 정보</h2>
            <input type="hidden" id="c-id">
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="input-group"><label>차량 번호</label><input type="text" id="c-car" class="font-black text-amber-400"></div>
                <div class="input-group"><label>모델명</label><input type="text" id="c-model"></div>
                <div class="input-group"><label>고객명</label><input type="text" id="c-name"></div>
                <div class="input-group"><label>연락처</label><input type="text" id="c-phone"></div>
                <div class="input-group col-span-2"><label>차대번호</label><input type="text" id="c-vin"></div>
                <div class="input-group col-span-2"><label>최초등록일</label><input type="date" id="c-first-date"></div>
            </div>
            <div class="flex gap-4">
                <button onclick="deleteRecord('customers', 'c-id')" class="flex-1 py-4 bg-red-600/10 text-red-500 border border-red-500/20 rounded-2xl font-bold">완전 삭제</button>
                <button onclick="saveCustomer()" class="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-black">마스터 업데이트</button>
            </div>
        </div>
    </div>

    <script>
        // 파이어베이스 설정 (절대 고정)
        const firebaseConfig = {
            apiKey: "AIzaSyDhTPGNKNm38PSBdATs9lks0lYu52QrP3A",
            authDomain: "lkmotors-246f1.firebaseapp.com",
            databaseURL: "https://lkmotors-246f1-default-rtdb.firebaseio.com",
            projectId: "lkmotors-246f1",
            storageBucket: "lkmotors-246f1.firebasestorage.app",
            messagingSenderId: "389443224",
            appId: "1:389443224:web:c9b78c1afd3abc1c262aed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let calendar;

        function login() {
            if(document.getElementById('pw').value === "9999") {
                document.getElementById('login-layer').style.display = 'none';
                initTimeSelect();
                initBays();
                initCalendar();
                initDraggable();
                startSync();
            } else { alert("비밀번호가 틀렸습니다."); }
        }

        function initTimeSelect() {
            const select = document.getElementById('m-time'); let opts = "";
            for(let h=8; h<=20; h++) { for(let m=0; m<60; m+=10) {
                const t = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
                opts += `<option value="${t}">${t}</option>`;
            }}
            select.innerHTML = opts;
        }

        function initBays() {
            const grid = document.getElementById('bay-grid'); grid.innerHTML = "";
            for(let i=1; i<=5; i++) {
                grid.innerHTML += `<div class="bay-item"><div class="text-[9px] font-black text-slate-500 flex justify-between px-1"><span>베이 ${i}</span><span id="bay-status-${i}">준비됨</span></div><div id="bay-zone-${i}" class="dr-zone flex-1 flex flex-col pt-1" data-bay="${i}"></div></div>`;
            }
        }

        // 데이터 실시간 동기화 (최신순 정렬 로직 포함)
        function startSync() {
            db.ref('repairs').on('value', (s) => {
                const data = s.val() || {};
                document.querySelectorAll('.dr-zone').forEach(z => z.innerHTML = ""); 
                const listBody = document.getElementById('list-body'); listBody.innerHTML = "";
                
                const now = new Date(); now.setHours(0,0,0,0);
                const todayStr = now.toISOString().split('T')[0];
                const tomStr = new Date(now.getTime() + 86400000).toISOString().split('T')[0];

                // 날짜순 내림차순 정렬 (최신이 위로)
                const sorted = Object.entries(data).sort((a, b) => new Date(b[1].date + ' ' + b[1].r_time) - new Date(a[1].date + ' ' + a[1].r_time));

                sorted.forEach(([id, car]) => {
                    const carCardHtml = `<div class="car-card" onclick="openEditModal('${id}')"><div class="flex justify-between items-start"><span class="text-blue-400 font-black text-[13px]">${car.carNo}</span><span class="text-[8px] text-slate-400">${car.model || ''}</span></div></div>`;
                    
                    listBody.innerHTML += `<tr class="border-b border-white/5 hover:bg-slate-800" onclick="openEditModal('${id}')"><td class="py-5 px-2"><span>${car.date}</span><br><span class="text-blue-500 text-[10px] font-black">${car.r_time||''}</span></td><td class="text-blue-400 font-black text-[13px]">${car.carNo}</td><td><span class="text-white">${car.name}</span><br><span class="text-amber-500 text-[9px]">${car.phone||'-'}</span></td><td>${car.model||'-'}</td><td class="text-[9px] opacity-60 truncate max-w-[150px]">${car.desc||'-'}</td></tr>`;

                    if(car.bay == "0") {
                        if(car.date === todayStr) document.getElementById('today-zone').innerHTML += carCardHtml;
                        else if(car.date === tomStr) document.getElementById('tomorrow-zone').innerHTML += carCardHtml;
                        else document.getElementById('other-zone').innerHTML += carCardHtml;
                    } else if(car.bay == "99") {
                        document.getElementById('done-zone').innerHTML += carCardHtml;
                    } else {
                        const target = document.getElementById(`bay-zone-${car.bay}`);
                        if(target) target.innerHTML = `<div class="flex-1 flex flex-col justify-between h-full pointer-events-auto" onclick="openEditModal('${id}')"><div class="text-center"><p class="bay-v-no">${car.carNo}</p><p class="text-[10px] text-slate-400">${car.model || ''}</p></div><div class="text-center"><p class="bay-v-worker">${car.mechanic || '대기'}</p></div></div>`;
                    }
                });
                
                if(calendar) {
                    calendar.removeAllEvents();
                    calendar.addEventSource(sorted.map(x => ({ id: x[0], title: x[1].carNo, start: x[1].date, backgroundColor: x[1].bay==='99'?'#059669':'#3b82f6', borderColor: 'transparent' })));
                }
                updateCounts();
            });
        }

        // 차량번호 4자리 조회 & 초기화 로직 (V8.1)
        function fetchInfo(searchValue, prefix) {
            const search = searchValue.toUpperCase();
            if (searchValue.length < 3) { clearFields(prefix); return; }

            db.ref('customers').once('value', s => {
                let found = false;
                s.forEach(child => {
                    const d = child.val();
                    if ((search.length >= 4 && d.carNo && d.carNo.endsWith(search)) || (isNaN(search) && d.name && d.name.includes(search))) {
                        document.getElementById(prefix + '-name').value = d.name || "";
                        document.getElementById(prefix + '-phone').value = d.phone || "";
                        document.getElementById(prefix + '-model').value = d.model || "";
                        document.getElementById(prefix + '-vin').value = d.vin || "";
                        document.getElementById(prefix + '-first-date').value = d.firstDate || "";
                        if (prefix === 'm') loadHistoryIntoModal(d.carNo);
                        found = true; return true;
                    }
                });
                if (!found) clearFields(prefix);
            });
        }

        function clearFields(prefix) {
            ['name','phone','model','vin','first-date'].forEach(id => {
                const el = document.getElementById(prefix + '-' + id); if(el) el.value = "";
            });
            if(prefix === 'm') document.getElementById('m-history-list').innerHTML = "";
        }

        function loadHistoryIntoModal(carNo) {
            db.ref('customers').orderByChild('carNo').equalTo(carNo).once('value', s => {
                const hList = document.getElementById('m-history-list'); hList.innerHTML = "";
                if(s.exists()){
                    const d = Object.values(s.val())[0];
                    if(d.history) Object.values(d.history).reverse().forEach(h => {
                        hList.innerHTML += `<div class="history-item"><b>[${h.date}]</b> ${h.desc} <span class="text-blue-400 text-[10px]">${h.mechanic||''}</span></div>`;
                    });
                }
            });
        }

        function saveData() { 
            const id = document.getElementById('m-id').value;
            const data = { carNo: document.getElementById('m-car').value.toUpperCase(), name: document.getElementById('m-name').value, phone: document.getElementById('m-phone').value, mechanic: document.getElementById('m-mechanic').value, date: document.getElementById('m-date').value, r_time: document.getElementById('m-time').value, model: document.getElementById('m-model').value, desc: document.getElementById('m-desc').value, vin: document.getElementById('m-vin').value.toUpperCase(), firstDate: document.getElementById('m-first-date').value };
            if(!data.carNo) return alert("차량 번호를 입력하세요.");
            if(id) db.ref('repairs/'+id).update(data).then(() => closeModal('edit-modal'));
            else { data.bay = "0"; db.ref('repairs').push(data).then(() => closeModal('edit-modal')); }
        }

        function releaseVehicle() { 
            const id = document.getElementById('m-id').value; 
            db.ref('repairs/'+id).once('value', s => { 
                const d = s.val(); 
                db.ref('customers').orderByChild('carNo').equalTo(d.carNo).once('value', cs => { 
                    if(cs.exists()) db.ref('customers/'+Object.keys(cs.val())[0]+'/history').push({ date: d.date, desc: d.desc, mechanic: d.mechanic }); 
                }); 
                db.ref('repairs/'+id).remove().then(() => { alert("출고 처리되었습니다."); closeModal('edit-modal'); }); 
            }); 
        }

        function initCalendar() { 
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), { 
                initialView:'dayGridMonth', locale:'ko', height:'100%', 
                headerToolbar:{left:'prev,next today', center:'title', right:''},
                eventClick:(info)=>openEditModal(info.event.id), dayMaxEvents: true
            }); calendar.render(); 
        }

        function initDraggable() { 
            document.querySelectorAll('.dr-zone').forEach(el => { 
                new Sortable(el, { 
                    group: 'vehicles', animation: 300, delay: 100,
                    onEnd: (evt) => { 
                        const idTag = evt.item.getAttribute('onclick'); if(!idTag) return;
                        const id = idTag.match(/'([^']+)'/)[1];
                        let bayVal = evt.to.getAttribute('data-bay');
                        db.ref('repairs/' + id).update({ bay: bayVal.includes('-') ? "0" : bayVal }); 
                    }
                }); 
            }); 
        }

        function showTab(id) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+id).classList.add('active');
            if(id==='res') setTimeout(()=>calendar.updateSize(), 200);
            if(id==='customer') syncCustomerDB("");
        }

        function openEditModal(id) { 
            document.getElementById('m-id').value = id || ""; 
            if(id) { 
                db.ref('repairs/'+id).once('value', s => { 
                    const d = s.val(); 
                    document.getElementById('m-car').value = d.carNo; document.getElementById('m-name').value = d.name;
                    document.getElementById('m-phone').value = d.phone; document.getElementById('m-mechanic').value = d.mechanic||"";
                    document.getElementById('m-date').value = d.date; document.getElementById('m-time').value = d.r_time;
                    document.getElementById('m-model').value = d.model; document.getElementById('m-desc').value = d.desc;
                    document.getElementById('m-vin').value = d.vin; document.getElementById('m-first-date').value = d.firstDate||"";
                    loadHistoryIntoModal(d.carNo);
                }); 
            } else { document.querySelectorAll('#edit-modal input, #edit-modal textarea').forEach(i => i.value = ""); }
            document.getElementById('edit-modal').style.display='flex'; 
        }

        function syncCustomerDB(key) {
            db.ref('customers').once('value', s => {
                const grid = document.getElementById('customer-grid'); grid.innerHTML = "";
                const search = key.toUpperCase();
                s.forEach(c => {
                    const d = c.val();
                    if(d.carNo.includes(search) || (d.name && d.name.includes(key))) {
                        grid.innerHTML += `<div class="bg-card p-6 rounded-[32px] border border-white/5 relative shadow-xl" onclick="openCustomerModal('${c.key}')"><input type="checkbox" value="${c.key}" onclick="event.stopPropagation()" class="cust-chk absolute top-5 right-5 w-5 h-5 accent-blue-500"><p class="text-amber-500 font-black text-xl">${d.carNo}</p><p class="text-xs text-white font-bold">${d.name} | ${d.model||'-'}</p></div>`;
                    }
                });
            });
        }

        function processCSV() {
            const fileInput = document.getElementById('csv-file');
            const status = document.getElementById('upload-status');
            if (!fileInput.files.length) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                const rows = e.target.result.split('\n');
                let count = 0;
                for(let i=1; i<rows.length; i++) {
                    const cols = rows[i].split(',');
                    if (cols.length >= 7 && cols[2]) {
                        const carNo = cols[2].trim();
                        const data = { carNo, name: cols[3].trim(), phone: cols[4].trim(), model: cols[5].trim(), vin: cols[6].trim(), firstDate: cols[13] ? cols[13].trim() : "" };
                        await db.ref('customers').push(data); count++;
                    }
                }
                status.innerText = `총 ${count}건 이관 완료`;
                setTimeout(() => { closeModal('upload-modal'); syncCustomerDB(""); }, 2000);
            };
            reader.readAsText(fileInput.files[0], 'EUC-KR');
        }

        function deleteRecord(path, idField) { 
            const id = document.getElementById(idField).value; 
            if(id && confirm("삭제하시겠습니까?")) db.ref(path+'/'+id).remove().then(() => closeModal(idField==='m-id'?'edit-modal':'c-modal')); 
        }

        function toggleSelectAll() { document.querySelectorAll('.cust-chk').forEach(cb => cb.checked = !cb.checked); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function updateCounts() {
            document.getElementById('count-today').innerText = document.getElementById('today-zone').childElementCount;
            document.getElementById('count-tomorrow').innerText = document.getElementById('tomorrow-zone').childElementCount;
            document.getElementById('count-other').innerText = document.getElementById('other-zone').childElementCount;
            document.getElementById('count-done').innerText = document.getElementById('done-zone').childElementCount;
        }
    </script>
</body>
</html>
