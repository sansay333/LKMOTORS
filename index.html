<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LK MOTORS - V3.9 (고객 DB 통합판)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; overflow: hidden; }
        .bg-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.05); }
        .dr-zone { min-height: 140px; border: 2px dashed #334155; border-radius: 24px; padding: 10px; }
        .car-card { cursor: pointer; background: #334155; padding: 10px; border-radius: 16px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); touch-action: manipulation; }
        .tab-btn.active { color: #3b82f6; border-bottom: 3px solid #3b82f6; }
        .tab-content { display: none; width: 100%; height: 100%; }
        .tab-content.active { display: flex; flex-direction: column; }
        @media (max-width: 768px) {
            #bay-grid { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; }
            #bay-grid > div { min-width: 160px; flex-shrink: 0; }
        }
        .input-group label { display: block; font-size: 10px; font-weight: 900; color: #94a3b8; margin-bottom: 4px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; color: #fff; outline: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="login-layer" class="fixed inset-0 bg-slate-950 z-[9000] flex items-center justify-center p-6">
        <div class="bg-slate-900 p-12 rounded-[40px] shadow-2xl w-full max-w-sm text-center border border-white/5 font-black italic">
            <h1 class="text-3xl text-blue-500 mb-8 uppercase">LK MOTORS</h1>
            <input type="password" id="pw" placeholder="PASSWORD" class="w-full bg-slate-800 rounded-2xl py-4 px-6 mb-4 text-center text-white outline-none border border-transparent focus:border-blue-500">
            <button onclick="login()" class="w-full py-4 bg-blue-600 rounded-2xl">시스템 접속</button>
        </div>
    </div>

    <nav class="h-16 bg-slate-900 border-b border-white/5 flex items-center px-6 justify-between shrink-0 overflow-x-auto no-scrollbar">
        <div class="flex gap-6 h-full shrink-0">
            <button onclick="showTab('status')" id="btn-status" class="tab-btn active font-black italic text-xs uppercase">작업 현황판</button>
            <button onclick="showTab('res')" id="btn-res" class="tab-btn font-black italic text-xs uppercase">예약 관리</button>
            <button onclick="showTab('customer')" id="btn-customer" class="tab-btn font-black italic text-xs uppercase text-amber-400">고객 DB 관리</button>
        </div>
    </nav>

    <main id="tab-status" class="tab-content active p-4 gap-4">
        <section class="grid grid-cols-5 gap-3 mb-2 shrink-0" id="bay-grid"></section>
        <section class="flex-1 grid grid-cols-2 lg:grid-cols-4 gap-3 overflow-hidden">
            <div class="bg-card rounded-[30px] p-4 flex flex-col shadow-xl">
                <h3 class="text-blue-400 font-black text-[10px] mb-3 border-b border-white/5 pb-1 italic">WAITING (TODAY)</h3>
                <div id="today-zone" class="flex-1 overflow-y-auto dr-zone custom-scroll" data-bay="0"></div>
            </div>
            <div class="bg-card rounded-[30px] p-4 flex flex-col shadow-xl">
                <h3 class="text-indigo-400 font-black text-[10px] mb-3 border-b border-white/5 pb-1 italic">TOMORROW</h3>
                <div id="tomorrow-zone" class="flex-1 overflow-y-auto dr-zone" data-bay="0-t"></div>
            </div>
            <div class="bg-card rounded-[30px] p-4 flex flex-col shadow-xl border-t-2 border-amber-500">
                <h3 class="text-amber-500 font-black text-[10px] mb-3 border-b border-white/5 pb-1 italic">OTHER WAIT</h3>
                <div id="other-zone" class="flex-1 overflow-y-auto dr-zone" data-bay="0-o"></div>
            </div>
            <div class="bg-card rounded-[30px] p-4 flex flex-col shadow-xl border-l-2 border-emerald-500">
                <h3 class="text-emerald-400 font-black text-[10px] mb-3 border-b border-white/5 pb-1 italic">DONE</h3>
                <div id="done-zone" class="flex-1 overflow-y-auto dr-zone" data-bay="99"></div>
            </div>
        </section>
    </main>

    <main id="tab-res" class="tab-content p-4 gap-4 overflow-hidden">
        <div class="flex gap-2 shrink-0">
            <button onclick="toggleResMode('cal')" id="btn-m-cal" class="bg-blue-600 px-4 py-2 rounded-lg text-xs font-bold">캘린더</button>
            <button onclick="toggleResMode('list')" id="btn-m-list" class="bg-slate-800 px-4 py-2 rounded-lg text-xs font-bold">리스트</button>
        </div>
        <div id="cal-view" class="flex-1 bg-slate-900 rounded-[30px] p-4 overflow-hidden"><div id='calendar'></div></div>
        <div id="list-view" class="hidden flex-1 bg-slate-900 rounded-[30px] p-4 overflow-y-auto custom-scroll">
            <table class="w-full text-left text-[11px]"><tbody id="list-body"></tbody></table>
        </div>
    </main>

    <main id="tab-customer" class="tab-content p-4 gap-4 overflow-hidden bg-slate-950">
        <div class="flex justify-between items-center shrink-0">
            <h2 class="text-lg font-black italic text-amber-500 uppercase">Customer Database</h2>
            <button onclick="openCustomerModal(null)" class="bg-amber-600 px-4 py-2 rounded-xl text-xs font-black">신규 고객 등록</button>
        </div>
        <div class="flex-1 bg-slate-900 rounded-[30px] p-6 overflow-y-auto custom-scroll shadow-2xl border border-white/5">
            <input type="text" oninput="searchCustomer(this.value)" placeholder="차량번호 또는 이름 검색..." class="w-full bg-slate-800 p-4 rounded-2xl mb-6 outline-none border border-white/5 focus:border-amber-500">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="customer-grid"></div>
        </div>
    </main>

    <div id="edit-modal" class="fixed inset-0 bg-black/90 z-[7000] hidden items-center justify-center p-4 backdrop-blur-xl">
        <div class="bg-slate-900 w-full max-w-2xl rounded-[40px] shadow-2xl border border-white/10 overflow-hidden relative">
            <button onclick="closeModal('edit-modal')" class="absolute top-6 right-8 text-slate-500 text-3xl">&times;</button>
            <div class="p-8 lg:p-12">
                <h2 class="text-2xl font-black italic text-blue-500 mb-8 uppercase" id="m-title">Update</h2>
                <input type="hidden" id="m-id">
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div class="input-group"><label>차량 번호</label><input type="text" id="m-car" oninput="fetchInfo(this.value, 'm')"></div>
                        <div class="input-group"><label>고객명</label><input type="text" id="m-name"></div>
                        <div class="input-group"><label>연락처</label><input type="text" id="m-phone"></div>
                        <div class="input-group"><label>담당 작업자</label><input type="text" id="m-worker"></div>
                    </div>
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4"><div class="input-group"><label>날짜</label><input type="date" id="m-date"></div><div class="input-group"><label>시간</label><input type="time" id="m-time"></div></div>
                        <div class="input-group"><label>모델 / km</label><div class="flex gap-2"><input type="text" id="m-model" class="w-2/3"><input type="number" id="m-km" class="w-1/3"></div></div>
                        <div class="input-group"><label>정비 상세</label><textarea id="m-desc" class="h-20 resize-none"></textarea></div>
                    </div>
                </div>
                <div class="flex gap-4 mt-8">
                    <button onclick="closeModal('edit-modal')" class="flex-1 py-4 bg-slate-800 rounded-2xl font-bold">닫기</button>
                    <button onclick="saveData()" class="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-black shadow-lg">저장</button>
                </div>
            </div>
        </div>
    </div>

    <div id="c-modal" class="fixed inset-0 bg-black/90 z-[8000] hidden items-center justify-center p-4 backdrop-blur-xl">
        <div class="bg-slate-900 w-full max-w-lg rounded-[40px] shadow-2xl border border-amber-500/20 overflow-hidden relative">
            <button onclick="closeModal('c-modal')" class="absolute top-6 right-8 text-slate-500 text-3xl">&times;</button>
            <div class="p-10">
                <h2 class="text-2xl font-black italic text-amber-500 mb-8 uppercase">Customer DB</h2>
                <input type="hidden" id="c-id">
                <div class="space-y-4">
                    <div class="input-group"><label>차량 번호</label><input type="text" id="c-car" placeholder="등록할 차량번호"></div>
                    <div class="input-group"><label>고객명</label><input type="text" id="c-name"></div>
                    <div class="input-group"><label>연락처</label><input type="text" id="c-phone"></div>
                    <div class="input-group"><label>차종 모델</label><input type="text" id="c-model"></div>
                </div>
                <div class="flex gap-4 mt-10">
                    <button onclick="deleteCustomer()" id="c-del-btn" class="flex-1 py-4 bg-red-900/20 text-red-500 rounded-2xl font-bold">삭제</button>
                    <button onclick="saveCustomer()" class="flex-[2] py-4 bg-amber-600 text-white rounded-2xl font-black">DB 저장</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDhTPGNKNm38PSBdATs9lks0lYu52QrP3A",
            authDomain: "lkmotors-246f1.firebaseapp.com",
            databaseURL: "https://lkmotors-246f1-default-rtdb.firebaseio.com",
            projectId: "lkmotors-246f1",
            storageBucket: "lkmotors-246f1.firebasestorage.app",
            messagingSenderId: "389443224",
            appId: "1:389443224:web:c9b78c1afd3abc1c262aed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let calendar;

        function login() {
            if(document.getElementById('pw').value === "9999") {
                document.getElementById('login-layer').style.display = 'none';
                initBays(); initCalendar(); initDraggable(); syncCustomerDB();
            } else { alert("비밀번호 불일치"); }
        }

        // [정보 자동 호출 로직]
        function fetchInfo(carNo, prefix) {
            if(carNo.length < 4) return;
            db.ref('customers').orderByChild('carNo').equalTo(carNo).once('value', s => {
                if(s.exists()){
                    const d = Object.values(s.val())[0];
                    document.getElementById(prefix+'-name').value = d.name || "";
                    document.getElementById(prefix+'-phone').value = d.phone || "";
                    document.getElementById(prefix+'-model').value = d.model || "";
                }
            });
        }

        // [고객 DB 저장 로직]
        function saveCustomer() {
            const carNo = document.getElementById('c-car').value;
            const id = document.getElementById('c-id').value;
            if(!carNo) return alert("번호 필수");
            const data = {
                carNo: carNo, name: document.getElementById('c-name').value,
                phone: document.getElementById('c-phone').value, model: document.getElementById('c-model').value
            };
            if(id) db.ref('customers/'+id).update(data).then(()=>closeModal('c-modal'));
            else db.ref('customers').push(data).then(()=>closeModal('c-modal'));
        }

        function syncCustomerDB() {
            db.ref('customers').on('value', s => {
                const grid = document.getElementById('customer-grid'); grid.innerHTML = "";
                s.forEach(c => {
                    const d = c.val();
                    grid.innerHTML += `<div class="bg-slate-800 p-5 rounded-3xl border border-white/5 cursor-pointer hover:border-amber-500" onclick="openCustomerModal('${c.key}')">
                        <p class="text-amber-500 font-black text-lg mb-1">${d.carNo}</p>
                        <p class="text-xs font-bold">${d.name} <span class="opacity-40">| ${d.model || '-'}</span></p>
                    </div>`;
                });
            });
        }

        function initBays() {
            const grid = document.getElementById('bay-grid'); grid.innerHTML = "";
            for(let i=1; i<=5; i++) {
                grid.innerHTML += `<div class="bg-card rounded-[35px] p-5 flex flex-col gap-2 relative min-w-[160px]">
                    <span class="absolute top-4 left-6 text-[9px] font-black text-slate-500 italic">BAY ${i}</span>
                    <div id="bay-zone-${i}" class="dr-zone flex-1" data-bay="${i}"></div>
                </div>`;
            }
            startSync();
        }

        function initDraggable() {
            document.querySelectorAll('.dr-zone').forEach(el => {
                new Sortable(el, { group: 'vehicles', animation: 150, onEnd: (evt) => {
                    const id = evt.item.getAttribute('data-id');
                    let bay = evt.to.getAttribute('data-bay');
                    if(bay.includes('-')) bay = "0"; 
                    db.ref('repairs/' + id).update({ bay: bay, status: (bay==="99"?"출고완료":(bay==="0"?"대기중":"정비중")) });
                }});
            });
        }

        function startSync() {
            db.ref('repairs').on('value', (s) => {
                const data = s.val();
                document.querySelectorAll('.dr-zone').forEach(z => z.innerHTML = ""); 
                document.getElementById('list-body').innerHTML = "";
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                const tomStr = new Date(now.setDate(now.getDate()+1)).toISOString().split('T')[0];

                for(let id in data) {
                    const car = data[id];
                    const carHtml = `<div class="car-card" data-id="${id}" onclick="openEditModal('${id}')">
                        <p class="text-blue-500 font-black text-sm">${car.carNo}</p>
                        <p class="text-[9px] font-bold text-slate-200 truncate">${car.name} | ${car.worker || '-'}</p>
                    </div>`;
                    document.getElementById('list-body').innerHTML += `<tr class="border-b border-white/5" onclick="openEditModal('${id}')"><td class="py-4 px-2">${car.date}</td><td>${car.carNo}</td><td>${car.name}</td></tr>`;
                    if(car.bay == "0") {
                        if(car.date === todayStr) document.getElementById('today-zone').innerHTML += carHtml;
                        else if(car.date === tomStr) document.getElementById('tomorrow-zone').innerHTML += carHtml;
                        else document.getElementById('other-zone').innerHTML += carHtml;
                    } else if(car.bay == "99") document.getElementById('done-zone').innerHTML += carHtml;
                    else {
                        const target = document.getElementById(`bay-zone-${car.bay}`);
                        if(target) target.innerHTML += carHtml;
                    }
                }
            });
        }

        function openEditModal(id) {
            document.getElementById('m-id').value = id || "";
            if(id) {
                db.ref('repairs/'+id).once('value', s => {
                    const d = s.val();
                    document.getElementById('m-car').value = d.carNo; document.getElementById('m-name').value = d.name;
                    document.getElementById('m-phone').value = d.phone; document.getElementById('m-worker').value = d.worker || "";
                    document.getElementById('m-date').value = d.date; document.getElementById('m-time').value = d.r_time;
                    document.getElementById('m-model').value = d.model; document.getElementById('m-km').value = d.km;
                    document.getElementById('m-desc').value = d.desc;
                });
            } else document.querySelectorAll('#edit-modal input, #edit-modal textarea').forEach(i => i.value = "");
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function openCustomerModal(id) {
            document.getElementById('c-id').value = id || "";
            document.getElementById('c-del-btn').style.display = id ? "block" : "none";
            if(id) {
                db.ref('customers/'+id).once('value', s => {
                    const d = s.val();
                    document.getElementById('c-car').value = d.carNo; document.getElementById('c-name').value = d.name;
                    document.getElementById('c-phone').value = d.phone; document.getElementById('c-model').value = d.model;
                });
            } else document.querySelectorAll('#c-modal input').forEach(i => i.value = "");
            document.getElementById('c-modal').style.display = 'flex';
        }

        function saveData() {
            const id = document.getElementById('m-id').value;
            const data = {
                carNo: document.getElementById('m-car').value, name: document.getElementById('m-name').value,
                phone: document.getElementById('m-phone').value, worker: document.getElementById('m-worker').value,
                date: document.getElementById('m-date').value, r_time: document.getElementById('m-time').value,
                model: document.getElementById('m-model').value, km: document.getElementById('m-km').value, desc: document.getElementById('m-desc').value
            };
            if(id) db.ref('repairs/'+id).update(data).then(() => closeModal('edit-modal'));
            else { data.bay = "0"; db.ref('repairs').push(data).then(() => closeModal('edit-modal')); }
        }

        function deleteCustomer() {
            if(confirm("이 고객 정보를 삭제할까요?")) db.ref('customers/'+document.getElementById('c-id').value).remove().then(()=>closeModal('c-modal'));
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+id).classList.add('active');
            if(id==='res' && calendar) setTimeout(() => calendar.updateSize(), 200);
        }
        function toggleResMode(m) {
            document.getElementById('cal-view').style.display = (m==='cal'?'block':'none');
            document.getElementById('list-view').style.display = (m==='list'?'block':'none');
            if(m==='cal') calendar.render();
        }
        function initCalendar() {
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView:'dayGridMonth', locale:'ko', height:'100%',
                headerToolbar:{left:'prev,next today', center:'title', right:'dayGridMonth,timeGridWeek'},
                eventClick: (info) => openEditModal(info.event.id)
            });
            calendar.render();
        }
    </script>
</body>
</html>
