<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LK MOTORS - V4.8 (차대번호 & 상세 리스트)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .bg-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.05); }
        .dr-zone { min-height: 80px; border: 1px dashed #334155; border-radius: 12px; padding: 5px; }
        .car-card { cursor: pointer; background: #334155; padding: 10px; border-radius: 12px; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.1); touch-action: pan-y; position: relative; z-index: 100; }
        .car-card:active { background: #475569; }
        .tab-btn.active { color: #3b82f6; border-bottom: 3px solid #3b82f6; }
        .tab-content { display: none; width: 100%; height: 100%; }
        .tab-content.active { display: flex; flex-direction: column; }
        
        @media (max-width: 768px) {
            #bay-grid { grid-template-columns: repeat(5, 1fr) !important; gap: 4px !important; }
            .bay-item { padding: 6px 2px !important; min-height: 100px !important; }
            .bay-item span { font-size: 7px !important; }
            .car-card { padding: 5px !important; }
            .car-card .c-no { font-size: 10px !important; }
            .car-card .c-info { font-size: 8px !important; }
            #list-view { padding: 5px !important; }
            .list-table th, .list-table td { font-size: 8px !important; padding: 4px 1px !important; }
        }

        .fc-event { cursor: pointer; font-size: 10px !important; border: none !important; padding: 1px 2px; }
        .input-group label { display: block; font-size: 11px; font-weight: 900; color: #94a3b8; margin-bottom: 2px; }
        .input-group input, .input-group textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px; color: #fff; outline: none; font-size: 13px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="login-layer" class="fixed inset-0 bg-slate-950 z-[9999] flex items-center justify-center p-6 text-center">
        <div class="bg-slate-900 p-10 rounded-[40px] shadow-2xl w-full max-w-sm border border-white/5 font-black italic">
            <h1 class="text-3xl text-blue-500 mb-6 uppercase tracking-tighter">LK MOTORS ERP V4.8</h1>
            <input type="password" id="pw" placeholder="PASSWORD" class="w-full bg-slate-800 rounded-2xl py-4 px-6 mb-4 text-center text-white outline-none border border-transparent focus:border-blue-500 font-bold">
            <button onclick="login()" class="w-full py-4 bg-blue-600 rounded-2xl font-bold shadow-lg">ENTER</button>
        </div>
    </div>

    <nav class="h-14 bg-slate-900 border-b border-white/5 flex items-center px-4 justify-between shrink-0 overflow-x-auto">
        <div class="flex gap-4 h-full">
            <button onclick="showTab('status')" id="btn-status" class="tab-btn active font-black text-xs uppercase">현황판</button>
            <button onclick="showTab('res')" id="btn-res" class="tab-btn font-black text-xs uppercase">예약관리</button>
            <button onclick="showTab('customer')" id="btn-customer" class="tab-btn font-black text-xs uppercase text-amber-500">고객이력</button>
        </div>
        <button onclick="openEditModal(null)" class="bg-blue-600 px-3 py-1.5 rounded-lg font-black text-[10px] text-white">신규등록</button>
    </nav>

    <main id="tab-status" class="tab-content active p-2 gap-2 overflow-y-auto custom-scroll">
        <section class="grid grid-cols-5 gap-2 shrink-0" id="bay-grid"></section>
        <section class="flex-1 grid grid-cols-2 lg:grid-cols-4 gap-2 pb-10">
            <div class="bg-card rounded-2xl p-3 border-t-2 border-blue-500"><h3 class="text-blue-400 font-black text-[9px] mb-2 uppercase italic">Wait (Today)</h3><div id="today-zone" class="flex-1 dr-zone" data-bay="0"></div></div>
            <div class="bg-card rounded-2xl p-3 border-t-2 border-indigo-500"><h3 class="text-indigo-400 font-black text-[9px] mb-2 uppercase italic">Tomorrow</h3><div id="tomorrow-zone" class="flex-1 dr-zone" data-bay="0-t"></div></div>
            <div class="bg-card rounded-2xl p-3 border-t-2 border-amber-500"><h3 class="text-amber-500 font-black text-[9px] mb-2 uppercase italic">Others</h3><div id="other-zone" class="flex-1 dr-zone" data-bay="0-o"></div></div>
            <div class="bg-card rounded-2xl p-3 border-t-2 border-emerald-500"><h3 class="text-emerald-400 font-black text-[9px] mb-2 uppercase italic">Done</h3><div id="done-zone" class="flex-1 dr-zone" data-bay="99"></div></div>
        </section>
    </main>

    <main id="tab-res" class="tab-content p-2 gap-2">
        <div class="flex gap-2 shrink-0">
            <button onclick="toggleResMode('cal')" id="btn-m-cal" class="bg-blue-600 px-4 py-2 rounded-lg text-xs font-bold">캘린더</button>
            <button onclick="toggleResMode('list')" id="btn-m-list" class="bg-slate-800 px-4 py-2 rounded-lg text-xs font-bold">상세 리스트</button>
        </div>
        <div id="cal-view" class="flex-1 bg-slate-900 rounded-2xl p-2 border border-white/5 overflow-hidden"><div id='calendar' class="h-full"></div></div>
        <div id="list-view" class="hidden flex-1 bg-slate-900 rounded-2xl p-4 overflow-y-auto border border-white/5">
            <table class="w-full text-left list-table font-bold text-slate-300">
                <thead class="text-slate-500 border-b border-white/5 uppercase">
                    <tr><th class="py-2 px-1">일시</th><th>차량번호</th><th>성함</th><th>연락처</th><th>모델</th><th>내용</th></tr>
                </thead>
                <tbody id="list-body"></tbody>
            </table>
        </div>
    </main>

    <main id="tab-customer" class="tab-content p-4 gap-4 overflow-hidden bg-slate-950">
        <input type="text" oninput="syncCustomerDB(this.value)" placeholder="차량번호/이름/차대번호 검색..." class="w-full bg-slate-800 p-3 rounded-xl outline-none border border-white/5 focus:border-amber-500 text-sm font-bold">
        <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-3 overflow-y-auto custom-scroll" id="customer-grid"></div>
    </main>

    <div id="edit-modal" class="fixed inset-0 bg-black/95 z-[9900] hidden items-center justify-center p-2 backdrop-blur-md">
        <div class="bg-slate-900 w-full max-w-2xl rounded-3xl border border-white/10 overflow-hidden relative shadow-2xl">
            <button onclick="closeModal('edit-modal')" class="absolute top-4 right-6 text-slate-500 text-3xl hover:text-white">&times;</button>
            <div class="p-6">
                <h2 class="text-lg font-black text-blue-500 mb-4 uppercase italic">Vehicle Management</h2>
                <input type="hidden" id="m-id">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <div class="input-group"><label>차량 번호</label><input type="text" id="m-car" oninput="fetchInfo(this.value, 'm')" class="uppercase font-black text-blue-400"></div>
                        <div class="input-group"><label>고객명</label><input type="text" id="m-name"></div>
                        <div class="input-group"><label>연락처</label><input type="text" id="m-phone"></div>
                        <div class="input-group"><label>차대번호 (VIN)</label><input type="text" id="m-vin" placeholder="차대번호 17자리"></div>
                        <div class="input-group"><label>최초 등록일</label><input type="date" id="m-first-date"></div>
                    </div>
                    <div class="space-y-2">
                        <div class="input-group"><label>담당 정비사</label><input type="text" id="m-mechanic"></div>
                        <div class="grid grid-cols-2 gap-2"><div class="input-group"><label>예약일</label><input type="date" id="m-date"></div><div class="input-group"><label>시간</label><input type="time" id="m-time"></div></div>
                        <div class="input-group"><label>모델/km</label><div class="flex gap-1"><input type="text" id="m-model" class="w-2/3"><input type="number" id="m-km" class="w-1/3"></div></div>
                        <div class="input-group"><label>정비 내용</label><textarea id="m-desc" class="h-20 text-xs"></textarea></div>
                    </div>
                </div>
                <div class="flex gap-2 mt-6">
                    <button onclick="saveData()" class="flex-[2] py-3 bg-blue-600 text-white rounded-xl font-black text-sm">정보 저장</button>
                    <button onclick="releaseVehicle()" id="rel-btn" class="flex-1 py-3 bg-emerald-600 text-white rounded-xl font-black text-sm">차량 출고</button>
                </div>
            </div>
        </div>
    </div>

    <div id="c-modal" class="fixed inset-0 bg-black/95 z-[9950] hidden items-center justify-center p-2">
        <div class="bg-slate-900 w-full max-w-lg rounded-3xl p-6 border border-amber-500/20 shadow-2xl relative">
            <button onclick="closeModal('c-modal')" class="absolute top-4 right-6 text-slate-500 text-3xl hover:text-white">&times;</button>
            <h2 class="text-lg font-black italic text-amber-500 mb-2 uppercase">Customer Profile</h2>
            <input type="hidden" id="c-id">
            <div class="space-y-2">
                <div class="grid grid-cols-2 gap-2">
                    <div class="input-group"><label>차량 번호</label><input type="text" id="c-car" class="font-black text-amber-400 uppercase"></div>
                    <div class="input-group"><label>차대번호</label><input type="text" id="c-vin"></div>
                </div>
                <div class="grid grid-cols-2 gap-2"><div class="input-group"><label>이름</label><input type="text" id="c-name"></div><div class="input-group"><label>연락처</label><input type="text" id="c-phone"></div></div>
                <div class="input-group"><label>최초 등록일</label><input type="date" id="c-first-date"></div>
                <div class="bg-slate-800 p-3 rounded-xl border border-white/5">
                    <p class="text-[10px] text-amber-500 font-bold mb-1 italic"> 정비 이력</p>
                    <div id="c-history-list" class="max-h-32 overflow-y-auto text-[10px] space-y-1 custom-scroll"></div>
                </div>
                <button onclick="saveCustomer()" class="w-full py-3 bg-amber-600 text-white rounded-xl font-black mt-2 text-sm">정보 업데이트</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDhTPGNKNm38PSBdATs9lks0lYu52QrP3A",
            authDomain: "lkmotors-246f1.firebaseapp.com",
            databaseURL: "https://lkmotors-246f1-default-rtdb.firebaseio.com",
            projectId: "lkmotors-246f1",
            storageBucket: "lkmotors-246f1.firebasestorage.app",
            messagingSenderId: "389443224",
            appId: "1:389443224:web:c9b78c1afd3abc1c262aed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let calendar;

        function login() {
            if(document.getElementById('pw').value === "9999") {
                document.getElementById('login-layer').style.display = 'none';
                initBays(); initCalendar(); initDraggable(); syncCustomerDB("");
            } else { alert("PASS ERROR"); }
        }

        function startSync() {
            db.ref('repairs').on('value', (s) => {
                const data = s.val();
                document.querySelectorAll('.dr-zone').forEach(z => z.innerHTML = ""); 
                document.getElementById('list-body').innerHTML = "";
                const todayStr = new Date().toISOString().split('T')[0];
                const tomStr = new Date(new Date().setDate(new Date().getDate()+1)).toISOString().split('T')[0];
                const events = [];

                for(let id in data) {
                    const car = data[id];
                    events.push({ id, title: `${car.carNo}`, start: car.date, backgroundColor: car.bay==="99"?'#059669':'#2563eb', borderColor: 'transparent' });
                    
                    const carHtml = `<div class="car-card shadow-lg" onclick="openEditModal('${id}')">
                        <span class="text-blue-400 font-black text-xs block c-no">${car.carNo}</span>
                        <p class="text-[8px] text-slate-300 truncate c-info">${car.name} | ${car.mechanic || '미정'}</p>
                    </div>`;

                    // [리스트 모드 전화번호 추가]
                    document.getElementById('list-body').innerHTML += `<tr class="border-b border-white/5" onclick="openEditModal('${id}')">
                        <td class="py-2 px-1"><span>${car.date}</span></td>
                        <td class="text-blue-400">${car.carNo}</td>
                        <td>${car.name}</td>
                        <td class="text-amber-400">${car.phone||'-'}</td>
                        <td>${car.model||'-'}</td>
                        <td class="opacity-40 truncate max-w-[80px]">${car.desc||'-'}</td>
                    </tr>`;

                    if(car.bay == "0") {
                        if(car.date === todayStr) document.getElementById('today-zone').innerHTML += carHtml;
                        else if(car.date === tomStr) document.getElementById('tomorrow-zone').innerHTML += carHtml;
                        else document.getElementById('other-zone').innerHTML += carHtml;
                    } else if(car.bay == "99") document.getElementById('done-zone').innerHTML += carHtml;
                    else {
                        const target = document.getElementById(`bay-zone-${car.bay}`);
                        if(target) target.innerHTML += carHtml;
                    }
                }
                if(calendar) { calendar.removeAllEvents(); calendar.addEventSource(events); }
            });
        }

        function saveData() {
            const id = document.getElementById('m-id').value;
            const data = {
                carNo: document.getElementById('m-car').value.toUpperCase(), name: document.getElementById('m-name').value,
                phone: document.getElementById('m-phone').value, mechanic: document.getElementById('m-mechanic').value,
                date: document.getElementById('m-date').value, r_time: document.getElementById('m-time').value,
                model: document.getElementById('m-model').value, km: document.getElementById('m-km').value, 
                desc: document.getElementById('m-desc').value, firstDate: document.getElementById('m-first-date').value,
                vin: document.getElementById('m-vin').value.toUpperCase()
            };
            if(!data.carNo) return alert("번호 필수");
            
            db.ref('customers').orderByChild('carNo').equalTo(data.carNo).once('value', s => {
                const cData = { carNo: data.carNo, name: data.name, phone: data.phone, model: data.model, firstDate: data.firstDate, vin: data.vin };
                if(!s.exists()) { db.ref('customers').push(cData); }
                else { db.ref('customers/'+Object.keys(s.val())[0]).update(cData); }
            });

            if(id) db.ref('repairs/'+id).update(data).then(() => closeModal('edit-modal'));
            else { data.bay = "0"; db.ref('repairs').push(data).then(() => closeModal('edit-modal')); }
        }

        function fetchInfo(carNo, prefix) {
            if(carNo.length < 4) return;
            db.ref('customers').orderByChild('carNo').equalTo(carNo.toUpperCase()).once('value', s => {
                if(s.exists()){
                    const d = Object.values(s.val())[0];
                    document.getElementById(prefix+'-name').value = d.name || "";
                    document.getElementById(prefix+'-phone').value = d.phone || "";
                    document.getElementById(prefix+'-model').value = d.model || "";
                    document.getElementById(prefix+'-first-date').value = d.firstDate || "";
                    document.getElementById(prefix+'-vin').value = d.vin || "";
                }
            });
        }

        function openCustomerModal(id) {
            document.getElementById('c-id').value = id;
            db.ref('customers/'+id).once('value', s => {
                const d = s.val();
                document.getElementById('c-car').value = d.carNo; document.getElementById('c-name').value = d.name;
                document.getElementById('c-phone').value = d.phone; document.getElementById('c-vin').value = d.vin || "";
                document.getElementById('c-first-date').value = d.firstDate || "";
                const hList = document.getElementById('c-history-list'); hList.innerHTML = "";
                if(d.history) Object.values(d.history).reverse().forEach(h => {
                    hList.innerHTML += `<div class="bg-slate-900/50 p-2 rounded-lg border border-white/5"><b>[${h.date}]</b> ${h.desc}</div>`;
                });
            });
            document.getElementById('c-modal').style.display = 'flex';
        }

        // 기존 V4.7의 드래그 & 클릭 & 베이 로직 유지
        function initBays() {
            const grid = document.getElementById('bay-grid'); grid.innerHTML = "";
            for(let i=1; i<=5; i++) {
                grid.innerHTML += `<div class="bay-item bg-card rounded-xl p-1 flex flex-col gap-1 relative min-h-[100px] border border-white/5 shadow-inner">
                    <span class="text-[7px] font-black text-slate-600 uppercase italic">BAY ${i}</span>
                    <div id="bay-zone-${i}" class="dr-zone flex-1 flex flex-col pt-1" data-bay="${i}"></div>
                </div>`;
            }
            startSync();
        }
        function initDraggable() {
            document.querySelectorAll('.dr-zone').forEach(el => {
                new Sortable(el, { group: 'vehicles', animation: 200, delay: 150, delayOnTouchOnly: true, onEnd: (evt) => {
                    const id = evt.item.getAttribute('onclick').match(/'([^']+)'/)[1];
                    let bay = evt.to.getAttribute('data-bay');
                    if(bay.includes('-')) bay = "0"; 
                    db.ref('repairs/' + id).update({ bay });
                }});
            });
        }
        function initCalendar() {
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView:'dayGridMonth', locale:'ko', height:'100%',
                headerToolbar:{left:'prev,next today', center:'title', right:'dayGridMonth'},
                eventClick: (info) => openEditModal(info.event.id)
            });
            calendar.render();
        }
        function openEditModal(id) {
            document.getElementById('m-id').value = id || "";
            document.getElementById('rel-btn').style.display = id ? "block" : "none";
            if(id) {
                db.ref('repairs/'+id).once('value', s => {
                    const d = s.val();
                    document.getElementById('m-car').value = d.carNo; document.getElementById('m-name').value = d.name;
                    document.getElementById('m-phone').value = d.phone; document.getElementById('m-mechanic').value = d.mechanic || "";
                    document.getElementById('m-date').value = d.date; document.getElementById('m-time').value = d.r_time;
                    document.getElementById('m-model').value = d.model; document.getElementById('m-km').value = d.km;
                    document.getElementById('m-desc').value = d.desc; document.getElementById('m-first-date').value = d.firstDate || "";
                    document.getElementById('m-vin').value = d.vin || "";
                });
            } else { document.querySelectorAll('#edit-modal input, #edit-modal textarea').forEach(i => i.value = ""); }
            document.getElementById('edit-modal').style.display = 'flex';
        }
        function releaseVehicle() {
            const id = document.getElementById('m-id').value;
            db.ref('repairs/'+id).once('value', s => {
                const d = s.val();
                const historyItem = { date: d.date, desc: d.desc, km: d.km, mechanic: d.mechanic || '기록없음' };
                db.ref('customers').orderByChild('carNo').equalTo(d.carNo).once('value', cs => {
                    if(cs.exists()) db.ref('customers/'+Object.keys(cs.val())[0]+'/history').push(historyItem);
                });
                db.ref('repairs/'+id).remove().then(() => { alert("출고완료/이력저장"); closeModal('edit-modal'); });
            });
        }
        function syncCustomerDB(key) {
            db.ref('customers').on('value', s => {
                const grid = document.getElementById('customer-grid'); grid.innerHTML = "";
                s.forEach(c => {
                    const d = c.val();
                    if(d.carNo.includes(key.toUpperCase()) || d.name.includes(key) || (d.vin && d.vin.includes(key.toUpperCase()))) {
                        grid.innerHTML += `<div class="bg-slate-800 p-4 rounded-2xl shadow-sm border border-white/5" onclick="openCustomerModal('${c.key}')">
                            <p class="text-amber-500 font-black text-sm uppercase">${d.carNo}</p>
                            <p class="text-[10px] text-slate-300 font-bold">${d.name} <span class="opacity-30">| ${d.vin||'VIN미입력'}</span></p>
                        </div>`;
                    }
                });
            });
        }
        function saveCustomer() {
            const id = document.getElementById('c-id').value;
            db.ref('customers/'+id).update({ 
                carNo: document.getElementById('c-car').value.toUpperCase(), name: document.getElementById('c-name').value, 
                phone: document.getElementById('c-phone').value, vin: document.getElementById('c-vin').value.toUpperCase(),
                firstDate: document.getElementById('c-first-date').value
            }).then(() => closeModal('c-modal'));
        }
        function toggleResMode(m) {
            document.getElementById('cal-view').style.display = (m==='cal'?'block':'none');
            document.getElementById('list-view').style.display = (m==='list'?'block':'none');
            document.getElementById('btn-m-cal').className = (m==='cal') ? 'bg-blue-600 px-4 py-2 rounded-lg text-xs font-bold' : 'bg-slate-800 px-4 py-2 rounded-lg text-xs font-bold';
            document.getElementById('btn-m-list').className = (m==='list') ? 'bg-blue-600 px-4 py-2 rounded-lg text-xs font-bold' : 'bg-slate-800 px-4 py-2 rounded-lg text-xs font-bold';
            if(m==='cal') calendar.render();
        }
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+id).classList.add('active');
            if(id==='res' && calendar) setTimeout(() => calendar.updateSize(), 200);
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function deleteRecord(path, idInput) { if(confirm("DELETE?")) db.ref(path+'/'+document.getElementById(idInput).value).remove().then(() => closeModal('edit-modal')); }
    </script>
</body>
</html>
