<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LK MOTORS - 실시간 작업 현황판</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; overflow: hidden; }
        .bay-card { background: #1e293b; border: 1px solid #334155; transition: all 0.3s; }
        .bay-active { border-color: #3b82f6; background: #0f172a; box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.2); }
        .status-btn { transition: transform 0.1s; }
        .status-btn:active { transform: scale(0.95); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="p-4 grid grid-cols-4 gap-4 bg-slate-900 border-b border-white/5">
        <div class="bg-blue-600 p-4 rounded-2xl flex justify-between items-center shadow-lg">
            <div><p class="text-xs opacity-80">공장 내</p><p class="text-2xl font-black" id="count-total">0대</p></div>
            <i class="fas fa-warehouse text-2xl opacity-30"></i>
        </div>
        <div class="bg-indigo-600 p-4 rounded-2xl flex justify-between items-center shadow-lg">
            <div><p class="text-xs opacity-80">오늘 예약</p><p class="text-2xl font-black" id="count-book">0대</p></div>
            <i class="fas fa-calendar-check text-2xl opacity-30"></i>
        </div>
        <div class="bg-orange-500 p-4 rounded-2xl flex justify-between items-center shadow-lg">
            <div><p class="text-xs opacity-80">작업 중</p><p class="text-2xl font-black" id="count-working">0대</p></div>
            <i class="fas fa-tools text-2xl opacity-30"></i>
        </div>
        <div class="bg-emerald-500 p-4 rounded-2xl flex justify-between items-center shadow-lg">
            <div><p class="text-xs opacity-80">출고 대기</p><p class="text-2xl font-black" id="count-done">0대</p></div>
            <i class="fas fa-paper-plane text-2xl opacity-30"></i>
        </div>
    </header>

    <section class="flex-1 p-4 overflow-y-auto grid grid-cols-2 md:grid-cols-5 gap-3" id="bay-container">
        </section>

    <footer class="h-1/3 bg-slate-900 border-t border-white/10 p-4 flex gap-4">
        <div class="flex-1 bg-slate-800/50 rounded-2xl p-4 overflow-hidden flex flex-col">
            <h3 class="text-blue-400 font-black text-sm mb-3 flex items-center gap-2">
                <i class="fas fa-clock"></i> 수리 대기 명단
            </h3>
            <div class="flex-1 overflow-y-auto space-y-2" id="wait-list"></div>
        </div>
        <div class="flex-1 bg-slate-800/50 rounded-2xl p-4 overflow-hidden flex flex-col">
            <h3 class="text-indigo-400 font-black text-sm mb-3 flex items-center gap-2">
                <i class="fas fa-calendar-alt"></i> 예약 현황
            </h3>
            <div class="flex-1 overflow-y-auto space-y-2" id="book-list"></div>
        </div>
    </footer>

    <div id="control-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-white/10 w-full max-w-md rounded-[40px] overflow-hidden shadow-2xl">
            <div class="p-6 bg-slate-800 flex justify-between items-center">
                <h2 class="text-xl font-black italic text-blue-400" id="modal-title">BAY 조작</h2>
                <button onclick="closeModal()" class="text-slate-400 text-2xl">&times;</button>
            </div>
            <div class="p-8">
                <p class="text-xs text-slate-500 mb-1">차량번호</p>
                <p id="modal-car" class="text-2xl font-black text-white mb-6 underline decoration-blue-500 underline-offset-8"></p>
                
                <p class="text-xs font-bold text-slate-400 mb-4">정비 단계 수동 조절</p>
                <div class="grid grid-cols-2 gap-3 mb-8">
                    <button onclick="updateStatus('입고')" class="status-btn py-4 bg-slate-800 rounded-2xl text-xs font-bold border border-white/5 hover:bg-slate-700">1단계: 입고</button>
                    <button onclick="updateStatus('진단')" class="status-btn py-4 bg-slate-800 rounded-2xl text-xs font-bold border border-white/5 hover:bg-slate-700">2단계: 진단</button>
                    <button onclick="updateStatus('수리중')" class="status-btn py-4 bg-slate-800 rounded-2xl text-xs font-bold border border-white/5 hover:bg-slate-700">3단계: 수리중</button>
                    <button onclick="updateStatus('완료')" class="status-btn py-4 bg-blue-600 rounded-2xl text-xs font-bold shadow-lg shadow-blue-500/30">4단계: 완료</button>
                </div>
                <button onclick="removeData()" class="w-full py-4 bg-red-900/30 text-red-500 rounded-2xl text-xs font-bold border border-red-500/20">데이터 삭제 (출고 처리)</button>
            </div>
        </div>
    </div>

    <script>
        // 파이어베이스 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDhTPGNKNm38PSBdATs9lks0lYu52QrP3A",
            authDomain: "lkmotors-246f1.firebaseapp.com",
            databaseURL: "https://lkmotors-246f1-default-rtdb.firebaseio.com",
            projectId: "lkmotors-246f1",
            storageBucket: "lkmotors-246f1.firebasestorage.app",
            messagingSenderId: "389443224",
            appId: "1:389443224:web:c9b78c1afd3abc1c262aed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentCarKey = "";
        let currentCarNo = "";

        // 1. BAY 생성 및 실시간 감시
        function initSystem() {
            const container = document.getElementById('bay-container');
            container.innerHTML = "";
            for(let i=10; i>=1; i--) { // 인동그룹처럼 10번부터 내림차순
                container.innerHTML += `
                    <div id="bay-${i}" class="bay-card rounded-3xl p-4 flex flex-col items-center justify-center relative min-h-[180px]">
                        <span class="absolute top-3 left-4 text-[10px] font-black text-slate-500 uppercase tracking-widest">BAY ${i}</span>
                        <div class="text-slate-600 font-black text-6xl opacity-20 mb-2">${i}</div>
                        <p class="text-xs text-slate-500">빈 베이</p>
                    </div>
                `;
            }
            loadRealtimeData();
        }

        // 2. 실시간 데이터 로드 (현황판 업데이트)
        function loadRealtimeData() {
            db.ref('repairs').on('value', (snapshot) => {
                const data = snapshot.val();
                resetBays();
                let counts = { total: 0, working: 0, done: 0 };

                for(let key in data) {
                    const car = data[key];
                    counts.total++;
                    
                    if(car.bay && car.bay !== "-") {
                        counts.working++;
                        updateBayUI(car.bay, car.carNo, car.status, key);
                    }
                    if(car.status === "완료") counts.done++;
                }
                updateDashboard(counts);
            });
        }

        function updateBayUI(bayNum, carNo, status, key) {
            const bayEl = document.getElementById(`bay-${bayNum}`);
            if(!bayEl) return;
            bayEl.classList.add('bay-active');
            bayEl.innerHTML = `
                <span class="absolute top-3 left-4 text-[10px] font-black text-blue-400">BAY ${bayNum}</span>
                <div class="text-center cursor-pointer" onclick="openControl('${carNo}', '${key}')">
                    <p class="text-xl font-black text-yellow-400 mb-1">${carNo}</p>
                    <span class="text-[10px] bg-blue-600 px-2 py-0.5 rounded text-white font-bold">${status}</span>
                </div>
            `;
        }

        function openControl(carNo, key) {
            currentCarKey = key;
            currentCarNo = carNo;
            document.getElementById('modal-car').innerText = carNo;
            document.getElementById('control-modal').style.display = 'flex';
        }

        function updateStatus(newStatus) {
            if(!currentCarKey) return;
            db.ref('repairs/' + currentCarKey).update({ status: newStatus })
            .then(() => {
                alert(newStatus + " 단계로 업데이트 되었습니다.");
                closeModal();
            });
        }

        function removeData() {
            if(!confirm("출고 처리하시겠습니까? 데이터가 삭제됩니다.")) return;
            db.ref('repairs/' + currentCarKey).remove().then(() => {
                alert("출고 처리 완료.");
                closeModal();
            });
        }

        function resetBays() {
            for(let i=1; i<=10; i++) {
                const b = document.getElementById(`bay-${i}`);
                if(b) {
                    b.classList.remove('bay-active');
                    b.innerHTML = `
                        <span class="absolute top-3 left-4 text-[10px] font-black text-slate-500">BAY ${i}</span>
                        <div class="text-slate-600 font-black text-6xl opacity-20 mb-2">${i}</div>
                        <p class="text-xs text-slate-500">빈 베이</p>
                    `;
                }
            }
        }

        function closeModal() { document.getElementById('control-modal').style.display = 'none'; }
        function updateDashboard(c) {
            document.getElementById('count-total').innerText = c.total + "대";
            document.getElementById('count-working').innerText = c.working + "대";
            document.getElementById('count-done').innerText = c.done + "대";
        }

        initSystem();
    </script>
</body>
</html>
