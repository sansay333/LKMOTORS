<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LK MOTORS - 통합 관제 시스템 V3</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; overflow: hidden; }
        .bg-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.05); }
        .bay-box { min-height: 200px; border: 2px dashed #334155; border-radius: 24px; transition: 0.3s; position: relative; }
        .car-card { cursor: pointer; background: #334155; padding: 12px; border-radius: 16px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .tab-btn.active { color: #3b82f6; border-bottom: 3px solid #3b82f6; }
        .tab-content { display: none; width: 100%; height: 100%; }
        .tab-content.active { display: flex; flex-direction: column; }
        .input-group label { display: block; font-size: 10px; font-weight: 900; color: #94a3b8; margin-bottom: 4px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 8px 12px; color: #fff; outline: none; }
        .fc-event { cursor: pointer !important; font-size: 11px; padding: 2px; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="login-layer" class="fixed inset-0 bg-slate-950 z-[5000] flex items-center justify-center">
        <div class="bg-slate-900 p-12 rounded-[40px] shadow-2xl w-full max-w-sm text-center border border-white/5">
            <h1 class="text-3xl font-black italic text-blue-500 mb-8 uppercase">LK MOTORS</h1>
            <input type="password" id="pw" placeholder="PASSWORD" class="w-full bg-slate-800 rounded-2xl py-4 px-6 mb-4 text-center outline-none border border-transparent focus:border-blue-500 text-white font-bold">
            <button onclick="login()" class="w-full py-4 bg-blue-600 rounded-2xl font-black shadow-lg">시스템 접속</button>
        </div>
    </div>

    <nav class="h-16 bg-slate-900 border-b border-white/5 flex items-center px-6 justify-between shrink-0">
        <div class="flex gap-10 h-full">
            <button onclick="showTab('status')" id="btn-status" class="tab-btn active font-black italic text-sm">작업 현황판</button>
            <button onclick="showTab('res')" id="btn-res" class="tab-btn font-black italic text-sm">예약 관리</button>
        </div>
        <div class="flex gap-4">
            <button onclick="openModal('reg-modal')" class="bg-blue-600 px-6 py-2 rounded-xl font-black text-xs text-white shadow-lg shadow-blue-500/20">
                <i class="fas fa-plus mr-2"></i>예약 등록
            </button>
        </div>
    </nav>

    <main id="tab-status" class="tab-content active p-4 gap-4">
        <section class="grid grid-cols-5 gap-4 mb-4" id="bay-grid"></section>

        <section class="flex-1 grid grid-cols-4 gap-4 overflow-hidden">
            <div class="bg-card rounded-[30px] p-5 flex flex-col shadow-xl">
                <h3 class="text-blue-400 font-black text-xs mb-4 uppercase italic border-b border-white/5 pb-2">수리 대기 (오늘)</h3>
                <div id="today-zone" class="flex-1 overflow-y-auto dr-zone custom-scroll" data-bay="0"></div>
            </div>
            <div class="bg-card rounded-[30px] p-5 flex flex-col shadow-xl">
                <h3 class="text-indigo-400 font-black text-xs mb-4 uppercase italic border-b border-white/5 pb-2">내일 예약</h3>
                <div id="tomorrow-zone" class="flex-1 overflow-y-auto custom-scroll"></div>
            </div>
            <div class="bg-card rounded-[30px] p-5 flex flex-col shadow-xl border-t-4 border-amber-500">
                <h3 class="text-amber-500 font-black text-xs mb-4 uppercase italic border-b border-white/5 pb-2">출고 대기</h3>
                <div id="ready-zone" class="flex-1 overflow-y-auto custom-scroll"></div>
            </div>
            <div class="bg-card rounded-[30px] p-5 flex flex-col shadow-xl border-l-4 border-emerald-500">
                <h3 class="text-emerald-400 font-black text-xs mb-5 italic uppercase border-b border-white/5 pb-2">완료/출고</h3>
                <div id="done-zone" class="flex-1 overflow-y-auto dr-zone custom-scroll" data-bay="99"></div>
            </div>
        </section>
    </main>

    <main id="tab-res" class="tab-content p-6 overflow-hidden">
        <div class="flex gap-2 mb-4">
            <button onclick="switchResMode('cal')" id="btn-m-cal" class="bg-blue-600 px-4 py-2 rounded-lg text-xs font-bold shadow-lg">캘린더 모드</button>
            <button onclick="switchResMode('list')" id="btn-m-list" class="bg-slate-800 px-4 py-2 rounded-lg text-xs font-bold hover:bg-slate-700">리스트 모드</button>
        </div>
        <div id="calendar-box" class="flex-1 bg-slate-900 rounded-[30px] p-6 shadow-2xl border border-white/5 overflow-hidden">
            <div id='calendar'></div>
        </div>
        <div id="list-box" class="hidden flex-1 bg-slate-900 rounded-[30px] p-6 shadow-2xl border border-white/5 overflow-y-auto custom-scroll">
            <table class="w-full text-left text-xs font-bold">
                <thead class="text-slate-500 border-b border-white/5 uppercase">
                    <tr><th class="py-4">날짜</th><th>차량번호</th><th>고객명</th><th>정비구분</th><th>상태</th></tr>
                </thead>
                <tbody id="res-list-body"></tbody>
            </table>
        </div>
    </main>

    <div id="reg-modal" class="fixed inset-0 bg-black/90 z-[3000] hidden items-center justify-center p-4 backdrop-blur-xl">
        <div class="bg-slate-900 w-full max-w-2xl rounded-[50px] shadow-2xl overflow-hidden text-white border border-white/10">
            <div class="p-10">
                <h2 class="text-2xl font-black italic text-blue-500 mb-8 uppercase tracking-tighter">Reservation System</h2>
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div class="input-group"><label>차량 번호</label><input type="text" id="r-car" placeholder="예: 123가 4567"></div>
                        <div class="input-group"><label>고객명</label><input type="text" id="r-name"></div>
                        <div class="input-group"><label>연락처</label><input type="text" id="r-phone"></div>
                        <div class="input-group"><label>차종/차대번호</label><input type="text" id="r-model"></div>
                    </div>
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="input-group"><label>예약 날짜</label><input type="date" id="r-date"></div>
                            <div class="input-group"><label>시작 시간</label><input type="time" id="r-time"></div>
                        </div>
                        <div class="input-group"><label>주행거리(km)</label><input type="number" id="r-km"></div>
                        <div class="input-group"><label>정비 요청 및 상세내용</label><textarea id="r-desc" class="h-28 resize-none font-medium"></textarea></div>
                    </div>
                </div>
                <div class="flex gap-4 mt-8">
                    <button onclick="closeModal('reg-modal')" class="flex-1 py-4 bg-slate-800 rounded-2xl font-bold">취소</button>
                    <button onclick="saveReservation()" class="flex-[2] py-4 bg-blue-600 rounded-2xl font-black text-lg">데이터 저장 및 등록</button>
                </div>
            </div>
        </div>
    </div>

    <div id="view-modal" class="fixed inset-0 bg-black/95 z-[4000] hidden items-center justify-center p-4 backdrop-blur-2xl">
        <div class="bg-slate-900 w-full max-w-md rounded-[50px] shadow-2xl border border-blue-500/20 overflow-hidden">
            <div class="p-10 text-center">
                <p class="text-blue-500 font-black text-4xl italic tracking-tighter mb-1" id="v-car">-</p>
                <p class="text-slate-500 text-[10px] font-black uppercase mb-8 tracking-widest underline underline-offset-4">Vehicle Data Center</p>
                
                <div class="space-y-4 text-left">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-800/50 p-4 rounded-2xl"><p class="text-[9px] text-slate-500 font-black uppercase mb-1">고객명</p><p class="font-black text-sm" id="v-name">-</p></div>
                        <div class="bg-slate-800/50 p-4 rounded-2xl"><p class="text-[9px] text-slate-500 font-black uppercase mb-1">연락처</p><p class="font-black text-sm text-blue-400" id="v-phone">-</p></div>
                    </div>
                    <div class="bg-slate-800/50 p-5 rounded-2xl">
                        <p class="text-[9px] text-slate-500 font-black uppercase mb-2 italic border-b border-white/5 pb-1">상세 제원</p>
                        <div class="flex justify-between mb-1"><span class="text-[11px] text-slate-400">모델명</span><span class="text-[11px] font-bold" id="v-model">-</span></div>
                        <div class="flex justify-between"><span class="text-[11px] text-slate-400">주행거리</span><span class="text-[11px] font-bold text-amber-500" id="v-km">-</span></div>
                    </div>
                    <div class="bg-blue-600/10 p-5 rounded-2xl border border-blue-500/20 shadow-inner">
                        <p class="text-[9px] text-blue-500 font-black mb-2 uppercase italic">정비 요청 내용</p>
                        <p class="text-xs font-bold text-slate-200 leading-relaxed custom-scroll max-h-24 overflow-y-auto" id="v-desc">-</p>
                    </div>
                </div>
                <button onclick="closeModal('view-modal')" class="w-full py-5 bg-blue-600 text-white rounded-[24px] font-black text-lg mt-8 shadow-xl">창 닫기</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDhTPGNKNm38PSBdATs9lks0lYu52QrP3A",
            authDomain: "lkmotors-246f1.firebaseapp.com",
            databaseURL: "https://lkmotors-246f1-default-rtdb.firebaseio.com",
            projectId: "lkmotors-246f1",
            storageBucket: "lkmotors-246f1.firebasestorage.app",
            messagingSenderId: "389443224",
            appId: "1:389443224:web:c9b78c1afd3abc1c262aed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let calendar;

        function login() {
            if(document.getElementById('pw').value === "9999") {
                document.getElementById('login-layer').style.display = 'none';
                initBays(); initCalendar(); initSortable();
            } else { alert("ACCESS DENIED"); }
        }

        function initBays() {
            const grid = document.getElementById('bay-grid'); grid.innerHTML = "";
            for(let i=1; i<=5; i++) {
                grid.innerHTML += `<div class="bg-card rounded-[35px] p-5 flex flex-col gap-4 shadow-xl relative border-t-2 border-transparent">
                    <span class="absolute top-4 left-6 text-[10px] font-black text-slate-600 italic">SYSTEM BAY ${i}</span>
                    <div class="h-6"></div>
                    <div id="bay-zone-${i}" class="bay-box dr-zone flex flex-col gap-2 p-2" data-bay="${i}"></div>
                </div>`;
            }
            startSync();
        }

        function initSortable() {
            document.querySelectorAll('.dr-zone').forEach(el => {
                new Sortable(el, { group: 'vehicles', animation: 200, onEnd: (evt) => {
                    db.ref('repairs/' + evt.item.getAttribute('data-id')).update({ bay: evt.to.getAttribute('data-bay') });
                }});
            });
        }

        function startSync() {
            db.ref('repairs').on('value', (s) => {
                const data = s.val();
                document.querySelectorAll('.dr-zone').forEach(z => z.innerHTML = ""); 
                document.getElementById('tomorrow-zone').innerHTML = "";
                document.getElementById('ready-zone').innerHTML = "";
                document.getElementById('res-list-body').innerHTML = "";
                
                const events = [];
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
                const tomorrowStr = tomorrow.toISOString().split('T')[0];

                for(let id in data) {
                    const car = data[id];
                    const carHtml = `<div class="car-card" data-id="${id}" onclick="showDetail('${id}')">
                        <div class="flex justify-between items-center mb-1"><span class="text-blue-400 font-black text-sm underline decoration-blue-500/30">${car.carNo}</span><span class="text-[9px] font-bold text-slate-500">${car.r_time || ''}</span></div>
                        <p class="text-[10px] font-bold text-slate-200">${car.name} <span class="opacity-40 font-medium">| ${car.model || '전차종'}</span></p>
                    </div>`;

                    // 리스트 모드 채우기
                    document.getElementById('res-list-body').innerHTML += `<tr class="border-b border-white/5 hover:bg-white/5 cursor-pointer" onclick="showDetail('${id}')"><td class="py-3">${car.date}</td><td>${car.carNo}</td><td>${car.name}</td><td>${car.r_type || '일반'}</td><td class="text-blue-500">${car.bay > 0 ? '정비중' : '대기'}</td></tr>`;

                    // 분류 로직 (사진 요청사항)
                    if(car.bay == "0") {
                        if(car.date === todayStr) document.getElementById('today-zone').innerHTML += carHtml;
                        else if(car.date === tomorrowStr) document.getElementById('tomorrow-zone').innerHTML += carHtml;
                        else if(car.bay == "0" && car.date < todayStr) document.getElementById('ready-zone').innerHTML += carHtml;
                    } else if(car.bay == "99") {
                        document.getElementById('done-zone').innerHTML += carHtml;
                    } else {
                        const target = document.getElementById(`bay-zone-${car.bay}`);
                        if(target) {
                            target.parentElement.style.borderColor = "#3b82f6";
                            target.innerHTML += carHtml;
                        }
                    }
                    events.push({ title: car.carNo, start: car.date, id: id, backgroundColor: car.bay == '99' ? '#10b981' : '#3b82f6' });
                }
                if(calendar) { calendar.removeAllEvents(); calendar.addEventSource(events); }
            });
        }

        function showDetail(id) {
            db.ref('repairs/' + id).once('value', s => {
                const d = s.val();
                document.getElementById('v-car').innerText = d.carNo;
                document.getElementById('v-name').innerText = d.name;
                document.getElementById('v-phone').innerText = d.phone;
                document.getElementById('v-model').innerText = d.model || '기재없음';
                document.getElementById('v-km').innerText = (d.km || 0).toLocaleString() + ' km';
                document.getElementById('v-desc').innerText = d.desc || '요청사항이 없습니다.';
                openModal('view-modal');
            });
        }

        function saveReservation() {
            const carNo = document.getElementById('r-car').value;
            if(!carNo) return alert("차량 번호 필수!");
            db.ref('repairs').push({
                carNo: carNo, name: document.getElementById('r-name').value, phone: document.getElementById('r-phone').value,
                model: document.getElementById('r-model').value, km: document.getElementById('r-km').value,
                date: document.getElementById('r-date').value, r_time: document.getElementById('r-time').value,
                desc: document.getElementById('r-desc').value, bay: "0"
            }).then(() => { closeModal('reg-modal'); });
        }

        function initCalendar() {
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth', locale: 'ko', height: '100%',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
                eventClick: (info) => showDetail(info.event.id)
            });
            calendar.render();
        }

        function switchResMode(mode) {
            if(mode === 'cal') {
                document.getElementById('calendar-box').classList.remove('hidden');
                document.getElementById('list-box').classList.add('hidden');
                document.getElementById('btn-m-cal').classList.replace('bg-slate-800', 'bg-blue-600');
                document.getElementById('btn-m-list').classList.replace('bg-blue-600', 'bg-slate-800');
                setTimeout(() => calendar.render(), 100);
            } else {
                document.getElementById('calendar-box').classList.add('hidden');
                document.getElementById('list-box').classList.remove('hidden');
                document.getElementById('btn-m-list').classList.replace('bg-slate-800', 'bg-blue-600');
                document.getElementById('btn-m-cal').classList.replace('bg-blue-600', 'bg-slate-800');
            }
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + id).classList.add('active');
            if(id === 'res') setTimeout(() => calendar.updateSize(), 200);
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
