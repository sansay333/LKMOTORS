<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LK MOTORS - 실시간 작업 현황판</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; overflow-x: hidden; }
        
        /* 인동그룹 특유의 다크 카드 스타일 */
        .dashboard-card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(255,255,255,0.05); }
        .bay-card { background: #1e293b; border: 2px dashed #334155; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bay-active { border: 2px solid #3b82f6; background: #0f172a; box-shadow: 0 0 25px rgba(59, 130, 246, 0.2); }
        
        /* 진행바 애니메이션 */
        .progress-ani { transition: width 0.8s ease-in-out; }
        
        /* 모바일 대응 스크롤 */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col p-2 lg:p-4">

    <header class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
        <div class="dashboard-card p-4 rounded-3xl flex justify-between items-center border-l-4 border-blue-500">
            <div><p class="text-[10px] text-slate-500 font-bold uppercase">공장 내 차량</p><p id="stat-total" class="text-2xl font-black text-white">0대</p></div>
            <div class="w-10 h-10 bg-blue-500/10 rounded-full flex items-center justify-center text-blue-500"><i class="fas fa-warehouse"></i></div>
        </div>
        <div class="dashboard-card p-4 rounded-3xl flex justify-between items-center border-l-4 border-indigo-500">
            <div><p class="text-[10px] text-slate-500 font-bold uppercase">오늘 예약</p><p id="stat-book" class="text-2xl font-black text-white">0대</p></div>
            <div class="w-10 h-10 bg-indigo-500/10 rounded-full flex items-center justify-center text-indigo-500"><i class="fas fa-calendar-check"></i></div>
        </div>
        <div class="dashboard-card p-4 rounded-3xl flex justify-between items-center border-l-4 border-amber-500">
            <div><p class="text-[10px] text-slate-500 font-bold uppercase">작업 가동률</p><p id="stat-rate" class="text-2xl font-black text-white">0%</p></div>
            <div class="w-10 h-10 bg-amber-500/10 rounded-full flex items-center justify-center text-amber-500"><i class="fas fa-chart-line"></i></div>
        </div>
        <div class="dashboard-card p-4 rounded-3xl flex justify-between items-center border-l-4 border-emerald-500">
            <div><p class="text-[10px] text-slate-500 font-bold uppercase">오늘 출고</p><p id="stat-done" class="text-2xl font-black text-white">0대</p></div>
            <div class="w-10 h-10 bg-emerald-500/10 rounded-full flex items-center justify-center text-emerald-500"><i class="fas fa-shipping-fast"></i></div>
        </div>
    </header>

    <section class="flex-1 grid grid-cols-2 md:grid-cols-5 gap-3 mb-4 content-start custom-scroll overflow-y-auto" id="bay-grid">
        </section>

    <footer class="h-1/3 grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="dashboard-card rounded-[32px] p-5 flex flex-col overflow-hidden">
            <h3 class="text-sm font-black text-blue-400 mb-4 flex items-center gap-2"><i class="fas fa-tools"></i> 수리 대기</h3>
            <div id="wait-list" class="flex-1 overflow-y-auto space-y-2 custom-scroll"></div>
        </div>
        <div class="dashboard-card rounded-[32px] p-5 flex flex-col overflow-hidden">
            <h3 class="text-sm font-black text-indigo-400 mb-4 flex items-center gap-2"><i class="fas fa-calendar-alt"></i> 내일 예약</h3>
            <div id="book-list" class="flex-1 overflow-y-auto space-y-2 custom-scroll"></div>
        </div>
        <div class="dashboard-card rounded-[32px] p-5 flex flex-col overflow-hidden">
            <h3 class="text-sm font-black text-emerald-400 mb-4 flex items-center gap-2"><i class="fas fa-check-circle"></i> 오늘 출고 완료</h3>
            <div id="done-list" class="flex-1 overflow-y-auto space-y-2 custom-scroll"></div>
        </div>
    </footer>

    <div id="control-panel" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-slate-900 w-full max-w-md rounded-[45px] overflow-hidden shadow-2xl border border-white/10">
            <div class="p-8 pb-4 text-white">
                <div class="flex justify-between items-center mb-4">
                    <span id="p-label" class="bg-blue-600 px-4 py-1 rounded-full text-[10px] font-black uppercase">입고 확인</span>
                    <span id="p-percent" class="text-blue-400 text-sm font-black">25%</span>
                </div>
                <div class="w-full bg-slate-800 h-2 rounded-full mb-6">
                    <div id="p-bar" class="bg-blue-500 h-2 rounded-full progress-ani" style="width: 25%;"></div>
                </div>
                <div class="bg-slate-800/50 p-4 rounded-2xl border-l-4 border-blue-500 mb-6">
                    <p class="text-[10px] text-slate-500 font-bold mb-1">현재 상태 코멘트</p>
                    <p id="p-comment" class="text-sm font-bold text-slate-200">차량이 입고되었습니다.</p>
                </div>
            </div>

            <div class="bg-white p-8 rounded-t-[45px]">
                <div class="flex justify-between items-center mb-6">
                    <h4 class="text-lg font-black text-slate-800 italic" id="p-car">경남99바5374</h4>
                    <button onclick="closeControl()" class="w-10 h-10 bg-slate-100 rounded-full text-slate-400">&times;</button>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <button onclick="updateStep(1)" class="py-4 bg-slate-800 text-white rounded-2xl text-[11px] font-bold">1단계: 입고</button>
                    <button onclick="updateStep(2)" class="py-4 bg-slate-800 text-white rounded-2xl text-[11px] font-bold">2단계: 진단</button>
                    <button onclick="updateStep(3)" class="py-4 bg-slate-800 text-white rounded-2xl text-[11px] font-bold">3단계: 수리중</button>
                    <button onclick="updateStep(4)" class="py-4 bg-blue-600 text-white rounded-2xl text-[11px] font-bold shadow-xl shadow-blue-200">4단계: 완료</button>
                </div>
                <button onclick="finishRepair()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black text-sm shadow-xl">최종 출고 및 데이터 삭제</button>
            </div>
        </div>
    </div>

    <script>
        // 파이어베이스 설정 (기존 설정 유지)
        const firebaseConfig = {
            apiKey: "AIzaSyDhTPGNKNm38PSBdATs9lks0lYu52QrP3A",
            authDomain: "lkmotors-246f1.firebaseapp.com",
            databaseURL: "https://lkmotors-246f1-default-rtdb.firebaseio.com",
            projectId: "lkmotors-246f1",
            storageBucket: "lkmotors-246f1.firebasestorage.app",
            messagingSenderId: "389443224",
            appId: "1:389443224:web:c9b78c1afd3abc1c262aed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentKey = ""; // 현재 조작 중인 차량 Key
        let currentCar = ""; // 현재 조작 중인 차량 번호

        // 1. 베이(BAY) 현황판 초기화
        function initBays() {
            const grid = document.getElementById('bay-grid');
            grid.innerHTML = "";
            for(let i=1; i<=10; i++) {
                grid.innerHTML += `
                    <div id="bay-${i}" class="bay-card rounded-[32px] p-5 flex flex-col items-center justify-center min-h-[160px] relative overflow-hidden">
                        <span class="absolute top-4 left-5 text-[9px] font-black text-slate-600 tracking-tighter uppercase">BAY ${i}</span>
                        <div class="text-slate-700/30 text-6xl font-black mb-1">${i}</div>
                        <p class="text-[10px] text-slate-600 font-bold">빈 정비 베이</p>
                    </div>
                `;
            }
            startSync();
        }

        // 2. 실시간 데이터 동기화 (인동그룹 핵심 기능)
        function startSync() {
            db.ref('repairs').on('value', (s) => {
                const data = s.val();
                clearBays(); // 베이 초기화 후 재배치
                let stats = { total: 0, book: 0, done: 0, working: 0 };

                for(let key in data) {
                    const car = data[key];
                    stats.total++;
                    
                    if(car.status === "완료") stats.done++;
                    
                    // 베이에 배정된 경우
                    if(car.bay && car.bay !== "-") {
                        stats.working++;
                        const bayEl = document.getElementById(`bay-${car.bay}`);
                        if(bayEl) {
                            bayEl.className = "bay-card bay-active rounded-[32px] p-5 flex flex-col items-center justify-center min-h-[160px] relative overflow-hidden cursor-pointer";
                            bayEl.onclick = () => openControl(key, car.carNo, car.step);
                            bayEl.innerHTML = `
                                <span class="absolute top-4 left-5 text-[9px] font-black text-blue-400 tracking-tighter uppercase">BAY ${car.bay}</span>
                                <div class="text-center">
                                    <p class="text-xs text-blue-500 font-bold mb-1">${car.owner || '정비중'}</p>
                                    <p class="text-xl font-black text-white tracking-tighter mb-2">${car.carNo}</p>
                                    <span class="bg-blue-600/20 text-blue-400 px-3 py-1 rounded-full text-[9px] font-black">${car.status}</span>
                                </div>
                            `;
                        }
                    }
                }
                updateStats(stats);
            });
        }

        // 3. 정비 단계 조작 함수 (인동그룹 스타일 패널)
        function openControl(key, carNo, step) {
            currentKey = key;
            currentCar = carNo;
            document.getElementById('p-car').innerText = carNo;
            document.getElementById('control-panel').style.display = 'flex';
            // 현재 상태 반영 로직 추가 가능
        }

        function updateStep(step) {
            const steps = {
                1: { status: "입고확인", percent: "25%", comment: "차량이 공장에 입고되었습니다." },
                2: { status: "정밀진단", percent: "50%", comment: "전문 정비사가 고장 원인을 진단 중입니다." },
                3: { status: "수리진행", percent: "75%", comment: "부품 교체 및 수리 작업이 진행 중입니다." },
                4: { status: "완료", percent: "100%", comment: "정비가 완료되었습니다. 출고 가능합니다." }
            };
            const target = steps[step];
            
            db.ref('repairs/' + currentKey).update({
                status: target.status,
                step: step,
                percent: target.percent,
                comment: target.comment
            }).then(() => {
                document.getElementById('p-label').innerText = target.status;
                document.getElementById('p-percent').innerText = target.percent;
                document.getElementById('p-bar').style.width = target.percent;
                document.getElementById('p-comment').innerText = target.comment;
            });
        }

        function finishRepair() {
            if(confirm("정비를 종료하고 차량을 출고 처리하시겠습니까?\n데이터는 이력으로 이동하며 현황판에서 사라집니다.")) {
                db.ref('repairs/' + currentKey).remove().then(() => {
                    alert("출고 처리가 완료되었습니다.");
                    closeControl();
                });
            }
        }

        function clearBays() {
            for(let i=1; i<=10; i++) {
                const b = document.getElementById(`bay-${i}`);
                b.className = "bay-card rounded-[32px] p-5 flex flex-col items-center justify-center min-h-[160px] relative overflow-hidden";
                b.onclick = null;
                b.innerHTML = `
                    <span class="absolute top-4 left-5 text-[9px] font-black text-slate-600 tracking-tighter uppercase">BAY ${i}</span>
                    <div class="text-slate-700/30 text-6xl font-black mb-1">${i}</div>
                    <p class="text-[10px] text-slate-600 font-bold">빈 정비 베이</p>
                `;
            }
        }

        function updateStats(s) {
            document.getElementById('stat-total').innerText = s.total + "대";
            document.getElementById('stat-done').innerText = s.done + "대";
            document.getElementById('stat-rate').innerText = (s.working * 10) + "%";
        }

        function closeControl() { document.getElementById('control-panel').style.display = 'none'; }
        
        initBays();
    </script>
</body>
</html>
